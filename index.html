<style>
:root{

@supports (transition-timing-function: linear(0, 1)) {

}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-weight:var(--w-body);
  overflow:hidden; -webkit-font-smoothing:antialiased;
  --rack-w-cur:var(--rack-w); --rack-top-cur:var(--rack-top); --th:var(--th-d);
  --title-top:calc(var(--tt)*1vh);
}
@media (max-aspect-ratio: 4/5){
  body{
    --rack-w-cur:var(--rack-w-m); --th:var(--th-m); --tk:var(--tk-m);
    --vh100:100vh;
    --rack-h:calc(var(--rack-w-m) / var(--rack-aspect));
    --title-top:max(calc(var(--tt)*1vh + 36px), calc(var(--vh100) + 12px - var(--rack-h) * (1 - var(--rod-at) / 100) - 1.5vh - var(--th)*1vh));
  }
  @supports (height:100dvh){ body{ --vh100:100dvh } }
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}

/* ── Scene / rack ── */
.scene{position:fixed;inset:0;z-index:1;overflow:hidden;overflow:clip}
.rack{
  position:absolute; left:50%; top:calc(var(--rack-top-cur)*1vh + 10px);
  width:var(--rack-w-cur); aspect-ratio:var(--rack-aspect); translate:-50% 0;
  filter:var(--rack-filter);
}
.rack-base{position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; user-select:none; -webkit-user-drag:none}
.coat{
  position:absolute; pointer-events:none;
  left:calc(var(--x)*1%); top:calc(var(--y)*1%); width:calc(var(--w)*1%);
  transform-origin:var(--hook) 0;
}
.coat-hover{transform-origin:var(--hook) 0; translate:0 0; transition:translate .6s var(--spring)}
.coat img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.coat.is-hover .coat-hover{translate:0 -7px}
@keyframes sway{0%{rotate:0deg}18%{rotate:1.8deg}42%{rotate:-1.2deg}64%{rotate:.6deg}84%{rotate:-.2deg}100%{rotate:0deg}}

.hit{
  position:absolute; z-index:50;
  top:12%; height:100vh;
  left:calc(var(--l)*1%); width:calc(var(--hw)*1%);

  cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.hit:focus{outline:none}
.hit:focus-visible{outline:2px dashed var(--blue); outline-offset:-8px}

/* ── Title ── */
.title{
  position:fixed; z-index:3; left:0; right:0; margin:0 auto;
  top:var(--title-top); height:calc(var(--th)*1vh);
  width:min(calc(var(--th)*var(--ta)*1vh), calc(var(--tmw)*1vw));
  pointer-events:none; transform-origin:50% 0;
  clip-path:inset(-2% -4%);
  opacity:0;
  transition:scale .9s var(--ease), top .9s var(--ease), translate .6s var(--ease), opacity .5s;
}
.title.ready{opacity:1}
.title.sync{transition:scale .9s var(--ease), top .9s var(--ease), opacity .5s}
body.in-section .title{scale:var(--tk); top:calc(var(--tt)*1vh)}
.word{
  position:absolute; left:0; top:0; display:flex;
  font-family:var(--f-title); font-weight:400; font-size:100px; line-height:1;
  color:var(--blue); white-space:pre; transform-origin:0 0;
}

.star{

/* ── Chrome ── */
.corner{
  position:fixed; z-index:4; bottom:max(14px, 2.8vh); margin:0;
  font-size:clamp(11px, 1.5vw, 22px); letter-spacing:.06em; text-transform:uppercase;
  font-weight:var(--w-body); pointer-events:none;
}

  font-family:var(--f-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink);
  display:flex; align-items:center; gap:8px; transition:opacity .5s}
.hint::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--coral); animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
body.used .hint, body.in-section .hint{opacity:0}
.corner.r{right:max(16px, 2vw)}
.back{
  position:fixed; z-index:4; top:max(12px, 2vh); left:max(12px, 2vw);
  width:54px; height:54px; border-radius:50%; border:0; padding:0;
  background:transparent; color:var(--ink); display:grid; place-items:center; cursor:pointer;
  opacity:0; visibility:hidden; transition:opacity .3s, visibility 0s .3s, background .2s;
}

/* ── Section template ── */
.section{

.sec-body{

  text-transform:uppercase; letter-spacing:var(--track); font-weight:var(--w-body);
  font-size:clamp(13px, 1.6vw, 22px); line-height:1.5;
}

.player{aspect-ratio:16/9; background:rgba(17,17,17,.06); border-radius:4px; overflow:hidden}

.tag{
  --cut:clamp(26px,3vw,38px);
  position:relative; display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:24px 40px;
  background:var(--paper); padding:clamp(22px,3vw,36px) clamp(22px,3vw,40px) clamp(22px,3vw,30px) calc(var(--cut) + clamp(30px,4vw,54px));
  clip-path:polygon(var(--cut) 0,100% 0,100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut));

/* ══ case study ══ */
.cs{max-width:1120px; margin:0 auto}

.note{flex:1 1 140px; max-width:220px; min-height:104px; margin:0; background:var(--mint); padding:14px 14px 18px; font-size:14px; line-height:1.45;
  box-shadow:0 10px 18px -14px rgba(20,40,40,.5); rotate:var(--r,0deg)}
.note:nth-child(3n+1){--r:-1.2deg} .note:nth-child(3n+2){--r:.9deg} .note:nth-child(3n){--r:-.4deg}
.emp .who{grid-area:who; align-self:center; width:clamp(130px,14vw,168px); aspect-ratio:1; border-radius:50%;
  background:var(--blue); color:#fff; display:grid; place-items:center; text-align:center; padding:18px; font-size:12px; line-height:1.35;
  font-family:var(--f-mono)}
@media (max-width:860px){
  .emp{grid-template-columns:1fr; grid-template-areas:"who" "say" "think" "feel" "do"}
  .emp .who{justify-self:center}
}

/* two directions, with rubber stamps */
.vers{display:grid; grid-template-columns:1fr 1fr; gap:clamp(18px,3vw,40px); margin-top:30px}
.vers figure{position:relative; margin:0}
.vers img{width:100%; display:block; border-radius:14px}
.vers .loser img{filter:grayscale(.35) contrast(.95); opacity:.85}
.vers .stamp{position:absolute; z-index:2; font-size:clamp(22px,2.6vw,36px); padding:10px 14px 8px; border-width:3px; background:var(--paper); mix-blend-mode:normal; box-shadow:0 6px 14px -10px rgba(0,0,0,.5)}
.vers .loser .stamp{left:6%; bottom:-22px; color:#55557a; rotate:-7deg}
.vers .winner .stamp{right:6%; bottom:-24px; rotate:5deg; display:flex; align-items:center; gap:8px}
.vers .winner .stamp svg{width:.9em; height:.9em; fill:currentColor}
.intro{margin:0; font-size:clamp(18px,1.6vw,22px); line-height:1.5; max-width:44ch}
@media (max-width:640px){ .vers{grid-template-columns:1fr; gap:46px} }

/* process as sewn-on labels */
.proc{display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(12px,2.4vw,28px); counter-reset:p}
.proc li{list-style:none; counter-increment:p; position:relative; display:flex; flex-direction:column; align-items:center; gap:10px;
  min-width:130px; padding:20px 18px 16px; background:var(--paper); text-transform:lowercase; font-size:18px}
.proc li::before{content:""; position:absolute; inset:6px; border:1px dashed rgba(17,17,17,.35)}
.proc li::after{content:"0" counter(p); position:absolute; top:8px; right:12px; font-family:var(--f-mono); font-size:10px; color:var(--coral)}
.proc svg{width:34px; height:34px; stroke:var(--blue); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.proc li:nth-child(odd){rotate:-1deg} .proc li:nth-child(even){rotate:1deg; translate:0 8px}

/* numbered list */
.chg{margin:0; padding:0; list-style:none; counter-reset:c}
.chg li{counter-increment:c; display:grid; grid-template-columns:56px 1fr; align-items:baseline; gap:12px;
  padding:16px 0; border-bottom:1px solid rgba(17,17,17,.18); font-size:clamp(18px,1.7vw,24px); line-height:1.35}
.chg li:first-child{border-top:1px solid rgba(17,17,17,.18)}
.chg li::before{content:"0" counter(c); font-family:var(--f-mono); font-size:13px; color:var(--coral)}

/* directions */
.dirs{display:grid; gap:clamp(36px,6vh,64px); margin-top:30px}
.dir h4{margin:0; font-family:var(--f-title); font-weight:400; text-transform:uppercase; color:var(--blue); font-size:clamp(26px,3vw,40px); line-height:1}
.dir p{margin:6px 0 16px; font-size:17px}
.dir .strip{overflow-x:auto; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch}
.dir .strip img{display:block; width:100%; min-width:640px; border-radius:6px}
.dir-n{font-family:var(--f-mono); font-size:12px; color:var(--coral); margin-right:10px; vertical-align:middle}

/* what we built: text + taped photo collage */
.built{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:clamp(24px,4vw,60px); align-items:start}
.built .txt{max-width:36ch}
.collage{display:grid; grid-template-columns:repeat(6,1fr); gap:12px}
.collage figure{margin:0; position:relative; background:#fff; padding:6px; box-shadow:0 10px 22px -16px rgba(0,0,0,.5)}
.collage img{display:block; width:100%; height:100%; object-fit:cover}
.collage figure:nth-child(1){grid-column:1 / span 6; rotate:-.8deg}
.collage figure:nth-child(n+2){grid-column:span 3}
.collage figure:nth-child(2){rotate:1.4deg} .collage figure:nth-child(3){rotate:-1.6deg}
.collage figure:nth-child(4){rotate:-1deg} .collage figure:nth-child(5){rotate:1.2deg}
.collage figure::before{content:""; position:absolute; z-index:2; top:-9px; left:50%; width:58px; height:18px; translate:-50% 0; rotate:-3deg;
  background:rgba(205,228,219,.85); box-shadow:0 1px 1px rgba(0,0,0,.08)}
@media (max-width:760px){ .built{grid-template-columns:1fr} }

.fig{margin:0 auto; max-width:900px}
.fig img{display:block; width:100%; height:auto; border-radius:6px}
.fig.wide{max-width:1120px}

.cs-next{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap;
  border-top:1px solid var(--ink); padding-top:20px; margin-top:clamp(70px,12vh,140px)}
.cs-next button{all:unset; cursor:pointer; text-align:right}
.cs-next button .kick{display:block; margin-bottom:6px}
.cs-next button strong{display:block; font-family:var(--f-title); font-weight:400; text-transform:uppercase; color:var(--blue);
  font-size:clamp(34px,5vw,74px); line-height:.92; transition:color .2s}
.cs-next button:hover strong{color:var(--coral)}
.cs-next button:focus-visible{outline:2px dashed var(--blue); outline-offset:6px}

.soon-card{max-width:620px; margin:clamp(40px,8vh,80px) auto 0; text-align:center}
.soon-card .woven{padding:34px 28px}
.soon-card p{margin:0; font-family:var(--f-mono); font-size:13px; letter-spacing:.1em; text-transform:uppercase}

/* ══ poster washing lines ══ */
.lines{display:grid; gap:clamp(60px,10vh,110px)}
.pline{position:relative}
.pline header{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px}
.pline h3{margin:0; font-family:var(--f-title); font-weight:400; text-transform:uppercase; color:var(--blue); font-size:clamp(30px,3.6vw,52px); line-height:1}
.pline header p{margin:0; font-family:var(--f-mono); font-size:12px; letter-spacing:.04em}
.cord{position:relative; height:26px}
.cord svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.cord path{fill:none; stroke:var(--ink); stroke-width:1.1; opacity:.7}
.pegs{display:flex; justify-content:safe center; gap:clamp(14px,2.4vw,34px); margin-top:-14px; padding:0 2vw; flex-wrap:nowrap; overflow-x:auto; overflow-y:visible;
  padding-bottom:30px; scrollbar-width:thin}
.poster{all:unset; cursor:zoom-in; position:relative; flex:0 1 250px; min-width:128px; transform-origin:50% 0;
  rotate:var(--r); transition:rotate .9s var(--spring), translate .9s var(--spring); padding-top:10px}
.poster:nth-child(3n+1){--r:-1.6deg} .poster:nth-child(3n+2){--r:1deg} .poster:nth-child(3n){--r:-.5deg}
.poster img{display:block; width:100%; height:auto; box-shadow:0 18px 30px -22px rgba(0,0,0,.6)}
.poster::before{ /* wooden peg */
  content:""; position:absolute; z-index:2; top:0; left:50%; width:10px; height:30px; translate:-50% 0; border-radius:2px;
  background:linear-gradient(90deg,#c8a97a,#e2c99d 45%,#b8946a); box-shadow:0 1px 2px rgba(0,0,0,.25)}
.poster:hover{rotate:calc(var(--r) * -1.8); translate:0 -4px}
.poster:focus-visible{outline:2px dashed var(--blue); outline-offset:6px}
.poster span{display:block; margin-top:10px; font-family:var(--f-mono); font-size:11px; letter-spacing:.04em; text-align:center; text-transform:uppercase}

/* lightbox */
.lb{border:0; padding:0; margin:auto; background:transparent; max-width:96vw; max-height:96vh; overflow:visible}
.lb::backdrop{background:rgba(238,235,230,.94)}
.lb figure{margin:0; display:flex; flex-direction:column; align-items:center}
.lb img{display:block; max-width:min(92vw,900px); max-height:84vh; width:auto; height:auto; box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.lb figcaption{margin-top:14px; font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink)}
.lb .x,.lb .pv,.lb .nx{position:fixed; border:0; background:var(--paper); color:var(--ink); width:48px; height:48px; border-radius:50%; cursor:pointer;
  font-family:var(--f-mono); font-size:18px; display:grid; place-items:center; box-shadow:0 2px 8px rgba(0,0,0,.12)}
.lb .x{top:16px; right:16px} .lb .pv{left:16px; top:50%} .lb .nx{right:16px; top:50%}
.lb button:focus-visible{outline:2px dashed var(--blue); outline-offset:3px}

/* ══ about ══ */
.about{display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.1fr); gap:clamp(28px,5vw,80px); align-items:start}
.portrait{position:relative; aspect-ratio:4/5; overflow:visible}
.portrait img,.portrait .ph{width:100%; height:100%; object-fit:cover; display:block}
.portrait::after{content:""; position:absolute; right:-18px; top:-18px; width:70px; height:66px; background:var(--coral); opacity:.92; mix-blend-mode:multiply;
  clip-path:polygon(50% 0%,61.8% 37.8%,100% 37.8%,69.1% 61.1%,80.9% 100%,50% 76.4%,19.1% 100%,30.9% 61.1%,0% 37.8%,38.2% 37.8%)}
.about-text p{margin:0 0 1.1em; font-size:clamp(17px,1.4vw,20px); line-height:1.6}
.chips{display:flex; flex-wrap:wrap; gap:10px; margin:10px 0 0; padding:0; list-style:none}
.chips li{position:relative; padding:9px 14px 8px; background:var(--paper); font-family:var(--f-mono); font-size:12px; letter-spacing:.05em; text-transform:uppercase}
.chips li::before{content:""; position:absolute; inset:3px; border:1px dashed rgba(17,17,17,.3); pointer-events:none}
.ab-h{margin:34px 0 8px; font-family:var(--f-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; border-top:1px solid var(--ink); padding-top:10px}
.facts{display:grid; grid-template-columns:auto 1fr; gap:10px 24px; margin:12px 0 0; font-size:15px}
.csf dt{font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding-top:2px}
.csf dd{margin:0}
.cvbtn{display:inline-flex; align-items:center; gap:10px; margin-top:30px; padding:14px 20px; background:var(--blue); color:#fff; text-decoration:none;
  font-family:var(--f-title); text-transform:uppercase; letter-spacing:.04em; font-size:18px}
.cvbtn:hover{background:var(--coral)}
@media (max-width:760px){ .about{grid-template-columns:1fr} .portrait{max-width:420px} }


/* ══ about: magazine spread ══ */
.ab{max-width:1120px; margin:0 auto}
.ab-spread{max-width:960px; margin:0 auto}
.ab-head{text-align:center; margin-bottom:clamp(26px,4vh,44px)}
.ab-head .kick{display:inline-block; color:var(--coral); margin-bottom:10px}
.ab-head h3{margin:0; font-family:var(--f-serif); font-style:italic; font-weight:400; color:var(--blue); font-size:clamp(46px,6.4vw,96px); line-height:.95; letter-spacing:-.01em}
.ab-cols{--figh:clamp(600px,84vh,760px); --figw:calc(var(--figh) * var(--ar)); position:relative; display:grid; grid-template-columns:1fr 1fr; min-height:var(--figh)}
.ab-col{position:relative}
.ab-flt{display:block; height:var(--figh); width:calc(var(--figw) / 2 + 2px); shape-margin:6px}
.ab-col.l .ab-flt{float:right}
.ab-col.r .ab-flt{float:left}
.ab-txt p{margin:0 0 .6em; font-family:var(--f-serif); font-size:clamp(20px,1.95vw,27px); line-height:1.24; text-align:justify; hyphens:auto; -webkit-hyphens:auto; color:var(--ink)}
.dropcap p:first-child::first-letter{float:left; font-family:var(--f-serif); color:#E4161B; font-size:5.2em; line-height:.78; margin:.06em .08em 0 -.02em}
.ab-pq{margin:.6em 0 0; font-family:var(--f-serif); font-style:italic; color:var(--coral); font-size:clamp(26px,2.4vw,34px); line-height:1.05}
.ab-pq::before{content:"“"} .ab-pq::after{content:"”"}
.ab-me{position:absolute; left:50%; top:0; margin:0; height:var(--figh); width:var(--figw); translate:-50% 0; pointer-events:none}
.ab-me img{display:block; width:100%; height:100%; object-fit:contain; pointer-events:auto; transform-origin:50% 100%;
  filter:drop-shadow(0 22px 22px rgba(30,20,60,.18))}
.ab-me figcaption{position:absolute; top:-30px; left:50%; translate:-50% 0; padding:7px 10px 6px; background:var(--blue); color:#fff; font-family:var(--f-mono); font-size:11px;
  letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; rotate:8deg; pointer-events:none}

.ab-credits{display:grid; grid-template-columns:auto repeat(3,minmax(0,1fr)); gap:20px clamp(18px,3vw,40px); align-items:start;
  margin:clamp(70px,11vh,120px) 0 0; padding:24px 0; border-top:2px solid var(--ink); border-bottom:1px solid var(--ink)}
.ab-cr-t{font-family:var(--f-serif); font-style:italic; font-size:34px; line-height:1; color:var(--blue)}
.ab-credits .ab-h{margin:0 0 10px; border:0; padding:0}
.ab-credits .chips{margin:0}
.ab-credits .facts{margin:0}
.ab-credits .cvbtn{margin-top:18px}

.ab-style{margin-top:clamp(90px,14vh,160px)}
.ab-big{margin:0; font-family:var(--f-title); font-weight:400; text-transform:uppercase; color:var(--blue); font-size:clamp(64px,13vw,200px); line-height:.82; letter-spacing:-.005em; text-align:center}
.ab-big em{font-family:var(--f-serif); font-style:italic; text-transform:none; color:var(--coral); font-size:1.08em; letter-spacing:-.02em; margin-left:-.06em; display:inline-block; rotate:-6deg; translate:0 .06em}
.ab-intro{max-width:34ch; margin:22px auto 0; text-align:center; font-family:var(--f-serif); font-size:clamp(20px,1.8vw,26px); line-height:1.3}
.looks{display:grid; grid-template-columns:repeat(12,1fr); gap:clamp(12px,1.8vw,24px); margin-top:clamp(40px,7vh,70px); grid-auto-flow:dense}
.look{all:unset; cursor:zoom-in; position:relative; grid-column:span 4; display:block}
.look.tall{grid-column:span 6; grid-row:span 2}
.look.wide{grid-column:span 8}
.look:nth-child(3n+2){margin-top:clamp(20px,5vw,70px)}
.look img{display:block; width:100%; height:100%; aspect-ratio:3/4; object-fit:cover; filter:saturate(.75) contrast(1.02); transition:filter .5s, scale .7s var(--spring)}
.look.tall img{aspect-ratio:auto}
.look:hover img{filter:none; scale:1.025}
.look span{position:absolute; left:10px; bottom:10px; padding:5px 8px 4px; background:var(--paper); font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase}
.look:focus-visible{outline:2px dashed var(--blue); outline-offset:5px}
.ab-banner{margin:clamp(30px,5vh,50px) 0 0; position:relative}
.ab-banner img{display:block; width:100%; aspect-ratio:21/9; object-fit:cover; object-position:50% 35%}
.ab-banner figcaption{margin-top:10px; font-family:var(--f-mono); font-size:12px; letter-spacing:.04em; text-align:right}
.ab-banner figcaption::before{content:"fig. — "; color:var(--coral)}

.ab-nails{margin-top:clamp(90px,14vh,160px); text-align:center}
.ab-nw{line-height:0}
.nw{display:inline-block; font-family:var(--f-title); font-size:clamp(110px,27vw,400px); line-height:.86; letter-spacing:.01em;
  color:transparent; -webkit-background-clip:text; background-clip:text; background-size:cover; background-position:50% 55%;
  -webkit-text-stroke:0; transition:background-position 3s ease}
.ab-nails:hover .nw{background-position:50% 35%}
.ab-nt{max-width:40ch; margin:clamp(14px,2.4vh,26px) auto 0}
.ab-nt .kick{color:var(--coral)}
.ab-nt p{margin:8px 0 0; font-family:var(--f-serif); font-size:clamp(24px,2.6vw,38px); line-height:1.15}
.swatches{display:flex; justify-content:center; flex-wrap:wrap; gap:clamp(16px,3vw,40px); margin-top:clamp(36px,6vh,60px)}
.swatch{all:unset; cursor:zoom-in; display:flex; flex-direction:column; align-items:center; gap:12px; width:clamp(120px,18vw,210px)}
.swatch img{display:block; width:100%; aspect-ratio:1; border-radius:50%; object-fit:cover; box-shadow:0 0 0 6px var(--paper), 0 18px 30px -18px rgba(0,0,0,.5);
  transition:rotate .8s var(--spring), scale .6s var(--spring)}
.swatch:nth-child(even){translate:0 26px}
.swatch:hover img{rotate:14deg; scale:1.06}
.swatch span{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase}
.swatch:focus-visible{outline:2px dashed var(--blue); outline-offset:6px; border-radius:50%}

@media (max-width:820px){
  .ab-cols{display:flex; flex-direction:column; min-height:0}
  .ab-me{order:-1; margin-top:40px !important}
  .ab-flt{display:none}
  .ab-me{position:relative; left:auto; translate:none; margin:0 auto 28px; --figh:62vh; height:var(--figh); width:calc(var(--figh) * var(--ar))}
  .ab-txt p{text-align:left; hyphens:manual}
  .ab-col + .ab-col{margin-top:.2em}
  .ab-credits{grid-template-columns:1fr}
  .looks{grid-template-columns:1fr 1fr}
  .look, .look.tall, .look.wide{grid-column:span 1; grid-row:auto}
  .look.tall{grid-column:span 2}
  .look.tall img{aspect-ratio:4/5}
  .look:nth-child(3n+2){margin-top:0}
  .swatch:nth-child(even){translate:0 0}
}


/* ══ about: beyond UX → playground ══ */
.ab-beyond{margin-top:clamp(90px,14vh,160px)}
.by-grid{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); gap:clamp(30px,5vw,80px); align-items:center; margin-top:clamp(40px,7vh,70px)}
.by-stack{position:relative; height:clamp(420px,62vh,600px)}
.by-ph{all:unset; cursor:zoom-in; position:absolute; top:50%; left:50%; width:44%; background:#fff; padding:8px 8px 34px;
  box-shadow:0 22px 40px -24px rgba(20,10,40,.55); translate:calc(-50% + (var(--i) - 1.5) * 34%) calc(-50% + (var(--i) - 1.5) * 4%);
  rotate:calc((var(--i) - 1.5) * 7deg); transition:rotate .5s var(--spring), translate .5s var(--spring), scale .5s var(--spring); z-index:calc(var(--i) + 1)}
.by-ph:nth-child(even){--lift:-4%}
.by-ph img{display:block; width:100%; aspect-ratio:3/4; object-fit:cover}
.by-ph::before{content:""; position:absolute; z-index:2; top:-9px; left:50%; width:58px; height:18px; translate:-50% 0; rotate:-4deg; background:rgba(205,228,219,.85)}
.by-stack:hover .by-ph{translate:calc(-50% + (var(--i) - 1.5) * 46%) calc(-50% + (var(--i) - 1.5) * 3%)}
.by-ph:hover{z-index:20; scale:1.05; rotate:0deg}
.by-ph:focus-visible{outline:2px dashed var(--blue); outline-offset:4px}
.by-text p{margin:0 0 .7em; font-family:var(--f-serif); font-size:clamp(22px,2.1vw,30px); line-height:1.22}
.by-text p:last-of-type{font-style:italic; color:var(--coral)}
.by-btn{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:14px; margin-top:22px; padding:18px 26px 16px; background:var(--blue); color:#fff;
  font-family:var(--f-title); text-transform:uppercase; letter-spacing:.03em; font-size:clamp(24px,2.4vw,34px); line-height:1;
  clip-path:polygon(14px 0,100% 0,100% 100%,0 100%,0 14px); transition:background .25s}
.by-btn .sstar{width:1em; height:.95em; fill:var(--coral); transition:rotate .7s var(--spring)}
.by-btn b{font-weight:400; transition:translate .4s var(--spring)}
.by-btn:hover{background:var(--coral)} .by-btn:hover .sstar{rotate:144deg; fill:#fff} .by-btn:hover b{translate:6px 0}
.by-btn:focus-visible{outline:2px dashed var(--blue); outline-offset:5px}
@media (max-width:820px){
  .by-grid{grid-template-columns:1fr}
  .by-stack{height:min(110vw,460px)}
  .by-ph{width:52%}
  .by-stack:hover .by-ph{translate:calc(-50% + (var(--i) - 1.5) * 34%) calc(-50% + (var(--i) - 1.5) * 4%)}
}

/* ══ playground canvas ══ */
body.in-canvas .section{overflow:hidden}
body.in-canvas.in-section .title{scale:calc(var(--tk) * .58)}
body.in-canvas .sec-body{display:none}
.pg{position:fixed; inset:0; overflow:hidden; touch-action:none; cursor:grab; outline:none; user-select:none; -webkit-user-select:none}
.pg.grabbing{cursor:grabbing}
.pg-world{position:absolute; left:0; top:0; will-change:transform;
  background-image:radial-gradient(rgba(46,46,163,.16) 1.2px, transparent 1.4px); background-size:34px 34px}
.pg-item{all:unset; position:absolute; cursor:pointer; display:block; background:#fff; padding:6px; box-sizing:border-box; rotate:var(--r);
  box-shadow:0 14px 28px -18px rgba(20,10,40,.6); transition:rotate .5s var(--spring), box-shadow .3s, scale .4s var(--spring)}
.pg-item img{display:block; width:100%; height:auto; pointer-events:none; -webkit-user-drag:none}
.pg-item.pg-poster{padding:0}
.pg-item:hover{scale:1.03}
.pg-item.front{rotate:0deg; scale:1.06; box-shadow:0 30px 50px -22px rgba(20,10,40,.7), 0 0 0 3px var(--coral)}
.pg-item:focus-visible{outline:3px dashed var(--blue); outline-offset:4px}
.pg-ui{position:fixed; inset:auto 0 0 0; z-index:3; pointer-events:none; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding:0 max(14px,2vw) max(14px,2.4vh)}
.pg-hint{margin:0; padding:9px 13px 8px; background:var(--paper); font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; position:relative; transition:opacity .6s}
.pg-hint::before{content:""; position:absolute; inset:3px; border:1px dashed rgba(17,17,17,.3)}
body.used .pg-hint{opacity:.55}
.pg-home{pointer-events:auto; all:unset; pointer-events:auto; cursor:pointer; display:inline-flex; align-items:center; gap:8px; padding:9px 13px 8px; margin-left:auto;
  background:var(--blue); color:#fff; font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase}
.pg-home .sstar{fill:var(--coral)}
.pg-home:hover{background:var(--coral)} .pg-home:hover .sstar{fill:#fff}
.pg-home:focus-visible{outline:2px dashed var(--blue); outline-offset:3px}
.pg-map{pointer-events:auto; position:relative; width:clamp(110px,12vw,170px); background:rgba(247,245,241,.9); box-shadow:0 0 0 1px rgba(17,17,17,.25); cursor:crosshair; overflow:hidden}
.pg-map-in{position:absolute; inset:0}
.pg-dot{position:absolute; background:var(--peri); opacity:.55}
.pg-dot.pg-poster{background:var(--blue)} .pg-dot.pg-nails{background:var(--coral)} .pg-dot.pg-me{background:#9fc8b8}
.pg-view{position:absolute; box-shadow:0 0 0 1.5px var(--ink); background:rgba(236,99,107,.12)}
@media (max-width:600px){ .pg-hint{display:none} .pg-map{width:96px} body.in-canvas.in-section .title{scale:calc(var(--tk) * .85)} }


/* ══ EDITS: reels ══ */
.reels{display:grid; gap:clamp(70px,11vh,120px)}
.rg-h{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; border-top:1px solid var(--ink); padding-top:12px}
.rg-h h3{margin:0; font-family:var(--f-title); font-weight:400; text-transform:uppercase; color:var(--blue); font-size:clamp(30px,3.6vw,52px); line-height:1}
.rg-h p{margin:0; font-family:var(--f-mono); font-size:12px; letter-spacing:.04em}
.rg-row{display:flex; gap:clamp(16px,3vw,40px); margin-top:clamp(24px,4vh,40px); overflow-x:auto; padding:10px 4px 26px; scroll-snap-type:x mandatory}
.reel.wide{flex-basis:clamp(300px,58vw,760px)}
.reel.wide .reel-ph{aspect-ratio:16/9; border-radius:16px}
.reel.wide .reel-ph::before{display:none}
.reel{flex:0 0 clamp(190px,22vw,280px); margin:0; scroll-snap-align:start; rotate:var(--r); transition:rotate .6s var(--spring)}
.reel:hover{rotate:0deg}
.reel-ph{position:relative; aspect-ratio:9/16; border-radius:26px; overflow:hidden; background:#16151d; box-shadow:0 0 0 7px #16151d, 0 26px 40px -24px rgba(0,0,0,.6)}
.reel-ph::before{content:""; position:absolute; z-index:2; top:9px; left:50%; width:30%; height:14px; translate:-50% 0; border-radius:10px; background:#16151d}
.reel-ph video,.reel-ph iframe{width:100%; height:100%; border:0; display:block; object-fit:cover; background:#000}
.reel-play{all:unset; cursor:pointer; position:absolute; inset:0}
.reel-play img{width:100%; height:100%; object-fit:cover; display:block}
.reel-play .pl,.reel-empty{position:absolute; inset:0; display:grid; place-content:center; justify-items:center; gap:10px; color:#fff;
  font-family:var(--f-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase}
.reel-play .pl .sstar,.reel-empty .sstar{width:56px; height:52px; fill:var(--coral); transition:rotate .7s var(--spring), scale .5s var(--spring)}
.reel-play:hover .sstar{rotate:144deg; scale:1.15}
.reel-play:focus-visible{outline:3px dashed var(--coral); outline-offset:-10px}
.reel-empty{background:repeating-linear-gradient(135deg,#1d1c25 0 14px,#22212b 14px 28px); color:rgba(255,255,255,.55)}
.reel figcaption{margin-top:18px; font-family:var(--f-mono); font-size:12px; letter-spacing:.04em}
.reel figcaption b{display:block; font-weight:500; text-transform:uppercase}
.reel figcaption span{opacity:.6}

/* ══ AI LAB ══ */
.ai{max-width:1080px; margin:0 auto}
.ai-st{margin:0 auto; max-width:24ch; text-align:center; font-family:var(--f-serif); font-size:clamp(30px,3.6vw,54px); line-height:1.08; color:var(--ink)}
.ai-ways{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(12px,2vw,24px); margin-top:clamp(50px,9vh,90px)}
.ai-way{position:relative; background:var(--paper); padding:22px 20px 26px; rotate:calc((var(--i) - 1.5) * 1.2deg); transition:rotate .5s var(--spring), translate .5s var(--spring)}
.ai-way::before{content:""; position:absolute; inset:5px; border:1px dashed rgba(17,17,17,.3); pointer-events:none}
.ai-way:hover{rotate:0deg; translate:0 -6px}
.ai-n{font-family:var(--f-mono); font-size:11px; color:var(--coral); letter-spacing:.1em}
.ai-way h4{margin:8px 0 10px; font-family:var(--f-title); font-weight:400; text-transform:uppercase; color:var(--blue); font-size:clamp(26px,2.4vw,34px); line-height:1}
.ai-way p{margin:0; font-size:15px; line-height:1.5}
.ai-proof{display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr); gap:clamp(24px,5vw,70px); align-items:center; margin-top:clamp(80px,13vh,140px)}
.ai-proof-t .kick{color:var(--coral)}
.ai-proof-t h3{margin:6px 0 14px; font-family:var(--f-serif); font-style:italic; font-weight:400; color:var(--blue); font-size:clamp(44px,5.4vw,80px); line-height:.95}
.ai-proof-t p{margin:0; font-size:17px; line-height:1.55; max-width:38ch}
.chat{display:flex; flex-direction:column; gap:14px}
.bub{max-width:86%; padding:14px 18px 15px; border-radius:20px; font-size:16px; line-height:1.45}
.bub p{margin:0}
.bub .who{display:block; margin-bottom:5px; font-family:var(--f-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; opacity:.7}
.bub.me{align-self:flex-end; background:var(--blue); color:#fff; border-bottom-right-radius:5px}
.bub.ai2{align-self:flex-start; background:var(--paper); border-bottom-left-radius:5px; box-shadow:inset 0 0 0 1px rgba(17,17,17,.12)}
.type:not(.done)::after{content:"▍"; animation:blink 1s steps(2) infinite}
.ai-tools{margin-top:clamp(60px,10vh,100px); text-align:center}
.ai-tools .chips{justify-content:center; margin-top:12px}
@media (max-width:820px){ .ai-ways{grid-template-columns:1fr 1fr} .ai-proof{grid-template-columns:1fr} }
@media (max-width:480px){ .ai-ways{grid-template-columns:1fr} }

/* ══ EXPERIENCE ══ */
.xp{max-width:980px; margin:0 auto; display:grid; gap:clamp(50px,8vh,80px)}
.xp-b{display:grid; grid-template-columns:minmax(150px,260px) 1fr; gap:16px clamp(20px,4vw,60px); border-top:2px solid var(--ink); padding-top:16px}
.xp-b h3{margin:0; font-family:var(--f-title); font-weight:400; text-transform:uppercase; color:var(--blue); font-size:clamp(30px,3.4vw,48px); line-height:1}
.xp ol{list-style:none; margin:0; padding:0}
.xp li{display:grid; grid-template-columns:110px 1fr; gap:16px; padding:14px 0; border-bottom:1px solid rgba(17,17,17,.18)}
.xp li:first-child{padding-top:4px}
.xp-when{font-family:var(--f-mono); font-size:13px; color:var(--coral); padding-top:4px}
.xp li b{display:block; font-family:var(--f-serif); font-weight:400; font-size:clamp(22px,2vw,28px); line-height:1.1}
.xp li em{display:block; margin-top:4px; font-style:normal; font-family:var(--f-mono); font-size:12px; letter-spacing:.04em; text-transform:uppercase}
.xp li p{margin:8px 0 0; font-size:15px; line-height:1.5}
.xp .cvbtn{justify-self:start; width:max-content; max-width:100%; display:inline-flex; gap:10px; align-items:center}
.cvbtn.ph{opacity:.55; cursor:default}
.cvbtn small{font-family:var(--f-mono); font-size:11px; text-transform:none; letter-spacing:0}
@media (max-width:700px){ .xp-b{grid-template-columns:1fr} .xp li{grid-template-columns:84px 1fr} }

/* ══ CONTACT: let's work together ══ */
.ct{max-width:1120px; margin:0 auto}
.ct-h{position:relative; margin:0; font-family:var(--f-title); font-weight:400; text-transform:uppercase; color:var(--blue);
  font-size:clamp(56px,11vw,190px); line-height:.84; letter-spacing:-.005em}
.ct-h span{display:inline-block}
.ct-h span:nth-child(3){color:var(--coral)}
.ct-h span:last-child{font-family:var(--f-serif); font-style:italic; text-transform:none; color:var(--ink); font-size:.82em; letter-spacing:-.02em}
.ct-h .stk{position:absolute; right:4%; top:-.15em; width:.7em; height:.65em; rotate:14deg; fill:var(--coral); opacity:.9; mix-blend-mode:multiply; animation:spin 40s linear infinite}
.ct-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(30px,5vw,80px); margin-top:clamp(40px,7vh,80px); align-items:start}
.ct-intro{margin:0 0 26px; font-family:var(--f-serif); font-size:clamp(22px,2.1vw,30px); line-height:1.2; max-width:26ch}
.ct-status{display:inline-flex; align-items:center; gap:10px; padding:8px 14px 7px; background:var(--paper); font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase}
.ct-status i{width:9px; height:9px; border-radius:50%; background:#3fb67f; box-shadow:0 0 0 0 rgba(63,182,127,.5); animation:ping 1.8s ease-out infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(63,182,127,0)}100%{box-shadow:0 0 0 0 rgba(63,182,127,0)}}
.ct-mail{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:30px}
.ct-mail .email{font-family:var(--f-mono); font-size:clamp(18px,2.2vw,28px); color:var(--ink); text-decoration:none; border-bottom:2px solid var(--coral); padding-bottom:3px; word-break:break-all}
.ct-mail .email:hover{color:var(--coral)}
.ct-mail .email.ph-text{border-bottom-style:dashed}
.ct-copy{all:unset; cursor:pointer; padding:7px 12px 6px; background:var(--blue); color:#fff; font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; transition:background .2s}
.ct-copy:hover{background:var(--coral)} .ct-copy.ok{background:#3fb67f}
.ct-copy[disabled]{opacity:.35; cursor:default}
.ct-copy:focus-visible{outline:2px dashed var(--blue); outline-offset:3px}
.ct-facts{display:grid; grid-template-columns:auto 1fr; gap:8px 22px; margin:30px 0 0}
.ct-facts dt{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--coral); padding-top:3px}
.ct-facts dd{margin:0; font-size:16px}
.ct-links{list-style:none; padding:0; margin:30px 0 0; display:flex; flex-wrap:wrap; gap:12px}
.ct-links a,.ct-links span{position:relative; display:inline-block; padding:11px 16px 10px; background:var(--paper); color:var(--ink); text-decoration:none;
  font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; transition:rotate .4s var(--spring)}
.ct-links a::before,.ct-links span::before{content:""; position:absolute; inset:3px; border:1px dashed rgba(17,17,17,.3)}
.ct-links a:hover{color:var(--coral); rotate:-3deg}
.ct-links span{opacity:.45}
.slip{position:relative; background:#fff; padding:28px clamp(20px,2.6vw,34px) 26px; rotate:1.2deg; box-shadow:0 30px 50px -30px rgba(20,10,40,.45);
  --hole:radial-gradient(circle at 50% 0, var(--bg) 7px, transparent 7.5px);
  -webkit-mask:radial-gradient(circle 9px at 50% 0, transparent 8.5px, #000 9px); mask:radial-gradient(circle 9px at 50% 0, transparent 8.5px, #000 9px)}
.slip-top{display:flex; justify-content:space-between; padding:6px 0 14px; border-bottom:2px dashed rgba(17,17,17,.25); font-family:var(--f-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase}
.slip-no{color:var(--coral)}
.slip fieldset{border:0; margin:18px 0 0; padding:0}
.slip legend,.slip-f > span{display:block; margin-bottom:9px; font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:.7}
.slip-chips{display:flex; flex-wrap:wrap; gap:8px}
.slip-chips label{cursor:pointer}
.slip-chips input{position:absolute; opacity:0; pointer-events:none}
.slip-chips span{display:inline-block; padding:8px 12px 7px; border:1.5px solid var(--ink); border-radius:999px; font-size:14px; transition:background .2s, color .2s, rotate .4s var(--spring)}
.slip-chips input:checked + span{background:var(--blue); border-color:var(--blue); color:#fff; rotate:-3deg}
.slip-chips input:focus-visible + span{outline:2px dashed var(--coral); outline-offset:2px}
.slip-f{display:block; margin-top:18px}
.slip-f input,.slip-f textarea{width:100%; box-sizing:border-box; border:0; border-bottom:1.5px solid var(--ink); background:transparent; padding:6px 0 8px;
  font-family:var(--f-serif); font-size:22px; color:var(--ink); resize:vertical; outline:none; border-radius:0}
.slip-f textarea{background-image:repeating-linear-gradient(transparent 0 33px, rgba(46,46,163,.18) 33px 34px); line-height:34px; border-bottom:0; padding-top:0}
.slip-f input:focus,.slip-f textarea:focus{border-color:var(--coral)}
.slip-go{all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:12px; width:100%; box-sizing:border-box; margin-top:22px; padding:16px 20px 14px;
  background:var(--coral); color:#fff; font-family:var(--f-title); text-transform:uppercase; font-size:clamp(24px,2.4vw,32px); line-height:1; transition:background .25s}
.slip-go .sstar{width:.9em; height:.85em; fill:#fff; transition:rotate .7s var(--spring)}
.slip-go:hover{background:var(--blue)} .slip-go:hover .sstar{rotate:144deg} .slip-go b{font-weight:400}
.slip-go[disabled]{opacity:.45; cursor:default}
.slip-go:focus-visible{outline:2px dashed var(--blue); outline-offset:4px}
.slip-note{margin:12px 0 0; font-family:var(--f-mono); font-size:11px; opacity:.6; text-align:center}
@media (max-width:820px){ .ct-grid{grid-template-columns:1fr} .slip{rotate:0deg} }


/* ══ warehouse details: silver, cardboard, clips ══ */
.back{background:var(--chrome)!important; box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 6px 14px -6px rgba(0,0,0,.45)!important; color:#111}

.tag{background:linear-gradient(180deg, rgba(255,255,255,.16), transparent 30%, rgba(80,50,10,.06)), var(--kraft)}

.tag::after{border-color:rgba(40,25,5,.25)}
.collage figure::before{background:rgba(200,164,121,.92)!important}
.by-ph::before{content:""; top:-30px; width:30px; height:44px; rotate:0deg; background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 44'><defs><linearGradient id='g' x1='0' x2='1'><stop offset='0' stop-color='%23858993'/><stop offset='.35' stop-color='%23f5f6f8'/><stop offset='.62' stop-color='%23b3b7bf'/><stop offset='1' stop-color='%23666a73'/></linearGradient></defs><path d='M9 20 C5 9 7 2 11.5 2 C15 2 15.5 9 13 20 M21 20 C25 9 23 2 18.5 2 C15 2 14.5 9 17 20' fill='none' stroke='url(%23g)' stroke-width='2.2' stroke-linecap='round'/><rect x='3' y='18' width='24' height='25' rx='2.5' fill='url(%23g)'/><rect x='3' y='18' width='24' height='3' fill='rgba(0,0,0,.18)'/></svg>") center/contain no-repeat;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.by-btn{background:#111}
.by-btn:hover{background:var(--blue)}

/* home: shipping label */
.ship{all:unset; position:fixed; z-index:4; top:max(18px,4vh); right:max(18px,3vw); width:190px; box-sizing:border-box; cursor:pointer;
  padding:20px 16px 14px; background:#fff; color:#111; rotate:4deg; transform-origin:50% 0;
  box-shadow:0 18px 30px -18px rgba(20,10,40,.45); display:flex; flex-direction:column; gap:3px;

.ship-clip{position:absolute; top:-26px; left:50%; translate:-50% 0; width:30px; height:44px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 44'><defs><linearGradient id='g' x1='0' x2='1'><stop offset='0' stop-color='%23858993'/><stop offset='.35' stop-color='%23f5f6f8'/><stop offset='.62' stop-color='%23b3b7bf'/><stop offset='1' stop-color='%23666a73'/></linearGradient></defs><path d='M9 20 C5 9 7 2 11.5 2 C15 2 15.5 9 13 20 M21 20 C25 9 23 2 18.5 2 C15 2 14.5 9 17 20' fill='none' stroke='url(%23g)' stroke-width='2.2' stroke-linecap='round'/><rect x='3' y='18' width='24' height='25' rx='2.5' fill='url(%23g)'/><rect x='3' y='18' width='24' height='3' fill='rgba(0,0,0,.18)'/></svg>") center/contain no-repeat;
  filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.ship-top{display:flex; align-items:center; gap:7px; padding-bottom:8px; margin-bottom:6px; border-bottom:2px solid #111; font-size:10px}
.ship-top i{width:8px; height:8px; border-radius:50%; background:#3fb67f; animation:ping 1.8s ease-out infinite}
.ship-l{font-family:var(--f-title); font-size:19px; letter-spacing:.02em; line-height:1.05}
.ship-l.hl{color:var(--blue)}
.ship-bc{display:flex; align-items:flex-end; justify-content:space-between; gap:8px; margin-top:10px; padding-top:8px; border-top:1px dashed rgba(0,0,0,.35)}
.ship-bc svg{width:96px; height:26px; fill:#111}
.ship-bc small{font-size:10px; color:var(--coral)}
body.in-section .ship{opacity:0; pointer-events:none}
@media (max-width:760px), (max-height:520px){ .ship{display:none} }

/* AI LAB text */
.ai-txt{max-width:720px; margin:clamp(40px,7vh,70px) auto 0}
.ai-txt p{margin:0 0 .9em; font-family:var(--f-serif); font-size:clamp(20px,1.9vw,27px); line-height:1.3}
.ai-txt p:last-child{font-style:italic; color:var(--coral); font-size:clamp(24px,2.4vw,34px); line-height:1.1; margin-top:1.2em}


/* ══ industrial pass ══ */
html.tex body{background-color:var(--bg);
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='c'><feTurbulence type='fractalNoise' baseFrequency='.0045' numOctaves='4' seed='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .3  0 0 0 0 .28  0 0 0 -.45 .26'/></filter><rect width='100%' height='100%' filter='url(%23c)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.55' numOctaves='3' seed='9' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .23  0 0 0 0 .2  0 0 0 -.9 .48'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
  background-size:900px 900px, 300px 300px}

/* chrome rails instead of black lines */
.xp-b, .rg-h{border-top:0; position:relative}
.xp-b::before, .rg-h::before, .ab-credits::before, .ab-credits::after{content:""; position:absolute; left:0; right:0; height:4px; border-radius:3px;

.xp-b::before, .rg-h::before{top:-2px}
.ab-credits{position:relative; border:0}
.ab-credits::before{top:0} .ab-credits::after{bottom:0}

/* credits headings: bold, blue, with a star */
.ab-credits .ab-h, .ab-h{display:flex; align-items:center; gap:7px; font-family:var(--f-title); font-size:clamp(20px,1.8vw,26px); letter-spacing:.02em;
  color:var(--blue); text-transform:uppercase; line-height:1}
.ab-h .sstar{width:.7em; height:.66em; fill:var(--coral); flex:none}

/* Dymo label chips */
.chips li{background:#151515; color:#f2f2f2; padding:8px 12px 7px; font-size:11.5px; letter-spacing:.14em; border-radius:2px;
  text-shadow:0 1px 0 rgba(255,255,255,.18), 0 -1px 0 rgba(0,0,0,.8); box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 3px 6px -3px rgba(0,0,0,.5)}
.chips li::before{display:none}
.chips li:nth-child(3n+1){rotate:-1.2deg} .chips li:nth-child(3n+2){rotate:.8deg}

/* black + red buttons */
.cvbtn{background:#111!important; color:#fff}
.cvbtn:hover{background:var(--coral)!important}
.ct-copy{background:#111}
.slip-go{background:#111}
.slip-go .sstar{fill:var(--coral)}
.slip-go:hover{background:var(--coral)} .slip-go:hover .sstar{fill:#fff}
.pg-home{background:#111}

/* home label hangs on a real hanger */
.ship{top:max(112px,15vh); right:max(28px,3.5vw); transform-origin:50% -100px}
.ship-hanger{position:absolute; left:50%; bottom:calc(100% - 9px); width:246px; translate:-50% 0; pointer-events:none;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.ship-clip{display:none}

/* nails */
.ab-nails{margin-top:clamp(100px,15vh,170px); text-align:left}
.ab-nw{text-align:center}
.nw{filter:contrast(1.1) saturate(1.05)}
.nl-grid{display:grid; grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr); gap:clamp(30px,5vw,70px); align-items:start; margin-top:clamp(30px,5vh,56px)}
.nl-text .kick{color:var(--coral)}
.nl-intro{margin:10px 0 26px; font-family:var(--f-serif); font-size:clamp(24px,2.3vw,33px); line-height:1.15}
.nl-pts{list-style:none; margin:0; padding:0; counter-reset:n}
.nl-pts li{counter-increment:n; display:grid; grid-template-columns:42px 1fr; gap:4px 10px; padding:14px 0; border-top:1px solid rgba(17,17,17,.2)}
.nl-pts li::before{content:"0" counter(n); grid-row:span 2; font-family:var(--f-mono); font-size:12px; color:var(--coral); padding-top:5px}
.nl-pts b{font-family:var(--f-title); font-weight:400; text-transform:uppercase; color:var(--blue); font-size:clamp(20px,1.8vw,26px); line-height:1}
.nl-pts span{font-size:15px; line-height:1.5}
.board{position:relative; padding:clamp(26px,3vw,40px) clamp(18px,2.4vw,32px) clamp(30px,3vw,44px); border-radius:6px;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px),
    linear-gradient(115deg,#8e939b 0%,#e9ebee 22%,#a5aab2 40%,#f4f5f7 55%,#9aa0a8 72%,#d9dce0 88%,#868b93 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6), inset 0 0 22px rgba(0,0,0,.18), 0 30px 50px -30px rgba(10,10,20,.55)}
.board::before,.board::after{content:""; position:absolute; top:12px; width:10px; height:10px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff,#8a8f97 60%,#4b4f56); box-shadow:0 1px 1px rgba(0,0,0,.4)}
.board::before{left:12px} .board::after{right:12px}
.board-l{position:absolute; top:-14px; left:24px; padding:7px 11px 6px; background:#151515; color:#f2f2f2; font-family:var(--f-mono); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; rotate:-2deg; text-shadow:0 1px 0 rgba(255,255,255,.18)}
.board-in{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(14px,2vw,24px)}
.pin{all:unset; cursor:zoom-in; position:relative; display:block; background:#fff; padding:5px 5px 0; rotate:var(--r);
  box-shadow:0 12px 18px -12px rgba(0,0,0,.55); transition:rotate .5s var(--spring), scale .5s var(--spring)}
.pin img{display:block; width:100%; aspect-ratio:4/5; object-fit:cover}
.pin span{display:block; padding:6px 2px 7px; font-family:var(--f-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pin .mag{position:absolute; z-index:2; top:-9px; left:50%; width:22px; height:22px; translate:-50% 0; border-radius:50%;
  background:radial-gradient(circle at 34% 30%, rgba(255,255,255,.75) 0 12%, transparent 30%), var(--m);
  box-shadow:inset 0 -3px 5px rgba(0,0,0,.35), 0 4px 6px -2px rgba(0,0,0,.45)}
.pin:hover{rotate:0deg; scale:1.05; z-index:3}
.pin:focus-visible{outline:2px dashed var(--blue); outline-offset:4px}
@media (max-width:820px){ .nl-grid{grid-template-columns:1fr} .board-in{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* in progress: warehouse scene */
.wh{position:relative; max-width:640px; margin:clamp(50px,8vh,80px) auto 0; height:clamp(520px,66vh,620px)}
.wh-rail{position:absolute; top:0; left:-8%; right:-8%; height:14px; border-radius:8px;
  background:linear-gradient(180deg,#fbfbfc 0%,#c6cad0 35%,#7b8088 70%,#a9adb4 100%); box-shadow:0 6px 10px -6px rgba(0,0,0,.45)}
.wh-hang{position:absolute; z-index:2; top:4px; left:50%; width:300px; translate:-50% 0; transform-origin:50% 0; animation:whswing 5s ease-in-out infinite}
@keyframes whswing{0%,100%{rotate:-1.6deg}50%{rotate:1.6deg}}
.wh-hanger{display:block; width:100%; filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
.wh-sign{position:relative; margin:-14px auto 0; width:76%; background:#111; color:#fff; text-align:center; padding:20px 14px 16px;
  box-shadow:0 18px 28px -18px rgba(0,0,0,.6)}
.wh-sign b{display:block; font-family:var(--f-title); font-weight:400; text-transform:uppercase; font-size:clamp(34px,4vw,48px); line-height:.95}
.wh-sign small{display:block; margin-top:8px; font-family:var(--f-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.75}
.wh-dot{position:absolute; top:10px; right:12px; width:9px; height:9px; border-radius:50%; background:var(--coral); animation:blink 1.4s steps(2) infinite}
.wh-boxes{position:absolute; left:0; right:0; bottom:0; height:44%}
.bx{position:absolute; display:block; border-radius:2px;
  background:linear-gradient(180deg, rgba(255,255,255,.14), transparent 30%, rgba(60,35,5,.12)), var(--kraft);
  box-shadow:inset 0 0 0 1px rgba(90,60,20,.25), 0 14px 20px -14px rgba(40,25,5,.6)}
.bx::before{content:""; position:absolute; left:50%; top:0; bottom:0; width:16%; translate:-50% 0; background:rgba(214,186,140,.75); box-shadow:inset 0 0 0 1px rgba(120,85,30,.18)}
.bx em{position:absolute; left:8%; bottom:10%; font-style:normal; font-family:var(--f-title); text-transform:uppercase; color:#2a1d0c; opacity:.8; font-size:clamp(11px,1.2vw,15px); letter-spacing:.06em}
.b1{left:2%; bottom:0; width:34%; height:46%} .b2{left:35%; bottom:0; width:30%; height:52%} .b3{left:64%; bottom:0; width:34%; height:44%}
.b4{left:10%; bottom:46%; width:28%; height:40%} .b5{left:38%; bottom:52%; width:32%; height:38%} .b6{left:70%; bottom:44%; width:22%; height:34%}
.b3 em, .b6 em{color:var(--coral); opacity:1}
@media (prefers-reduced-motion: reduce){ .wh-hang,.wh-dot{animation:none} }


/* ══ nails as an editorial file ══ */
.nfile{position:relative; display:grid; grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr); margin-top:clamp(30px,5vh,56px);
  background:#2a2b30; padding:clamp(10px,1.4vw,18px); border-radius:14px; box-shadow:0 40px 60px -40px rgba(0,0,0,.7)}
.nf-sleeve{position:relative; background:#eef0f2; padding:clamp(20px,2.6vw,34px) clamp(16px,2vw,28px) clamp(20px,2.6vw,34px) clamp(40px,4vw,56px);
  border-radius:6px 0 0 6px; box-shadow:inset -10px 0 18px -10px rgba(0,0,0,.35)}
.nf-holes{position:absolute; left:12px; top:6%; bottom:6%; width:12px;
  background:radial-gradient(circle, #2a2b30 4px, transparent 4.6px) 0 0/12px 34px repeat-y}
.nf-photos{position:relative; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(10px,1.4vw,18px)}
.nf-ph{all:unset; cursor:zoom-in; position:relative; display:block; background:#fff; padding:4px 4px 0; rotate:var(--r);
  box-shadow:0 8px 14px -10px rgba(0,0,0,.5); transition:rotate .5s var(--spring), scale .5s var(--spring)}
.nf-ph img{display:block; width:100%; aspect-ratio:4/5; object-fit:cover; filter:contrast(1.04)}
.nf-ph span{display:block; padding:5px 2px 6px; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.nf-ph:hover{rotate:0deg; scale:1.06; z-index:4}
.nf-ph:focus-visible{outline:2px dashed var(--blue); outline-offset:3px}
.nf-ev{position:absolute; z-index:3; right:-8px; bottom:22px; width:30px; height:30px; display:grid; place-items:center; background:#f2c230; color:#111;
  font-family:var(--f-title); font-style:normal; font-size:18px; rotate:-14deg; clip-path:polygon(0 18%,100% 0,100% 100%,0 100%); box-shadow:0 3px 4px rgba(0,0,0,.25)}
.nf-sheen{position:absolute; inset:0; pointer-events:none; border-radius:inherit;
  background:linear-gradient(115deg, rgba(255,255,255,.0) 0%, rgba(255,255,255,.55) 18%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 62%, rgba(255,255,255,.35) 74%, rgba(255,255,255,0) 86%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.7); mix-blend-mode:screen}
.foil{position:absolute; z-index:5; display:block; width:84px; height:30px; pointer-events:none;
  background:linear-gradient(105deg,#7d838c 0%,#f4f6f8 14%,#a0a6ae 26%,#e8eaee 37%,#6f757e 48%,#d9dde2 60%,#8d939c 72%,#fafbfc 84%,#9298a0 100%);
  clip-path:polygon(3% 8%,12% 0,24% 10%,38% 2%,52% 9%,66% 1%,80% 8%,94% 0,100% 12%,97% 52%,100% 92%,88% 100%,74% 90%,58% 99%,44% 91%,28% 100%,14% 91%,2% 98%,0 55%);
  opacity:.94; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.foil.f0{top:-12px; left:-18px; rotate:-32deg}
.foil.f5{top:-10px; right:-20px; rotate:28deg}
.nf-folder{position:relative; background:linear-gradient(180deg, rgba(255,255,255,.12), transparent 30%), #b9b6ad; color:#1d1d24;
  padding:clamp(26px,3vw,40px) clamp(20px,2.6vw,36px); border-radius:0 6px 6px 0; box-shadow:inset 10px 0 18px -10px rgba(0,0,0,.35)}
.foil.ftop{top:-8px; right:18%; width:130px; height:40px; rotate:8deg}
.nf-tie{position:absolute; right:-6px; top:48%; width:34px; height:3px; background:#efe9dc; box-shadow:0 1px 1px rgba(0,0,0,.25)}
.nf-lines{display:flex; justify-content:space-between; font-family:var(--f-serif); font-size:16px; border-bottom:1px solid rgba(29,29,36,.5); padding-bottom:6px}
.nf-lines b{font-family:var(--f-title); font-weight:400; color:var(--blue); font-size:18px; letter-spacing:.04em}
.nf-title{margin:18px 0 0; font-family:var(--f-serif); font-style:italic; font-weight:400; color:var(--blue); font-size:clamp(46px,5vw,72px); line-height:.95;
  border-bottom:1px solid rgba(29,29,36,.5); padding-bottom:10px}
.nf-sub{margin:10px 0 22px; font-family:var(--f-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#2a2a55}
.nf-folder .kick{color:var(--coral)}
.nf-folder .nl-intro{font-size:clamp(20px,1.8vw,26px); margin:8px 0 16px}
.nf-folder .nl-pts li{border-top-color:rgba(29,29,36,.35)}
.nf-folder .nl-pts span{font-family:var(--f-mono); font-size:12.5px; line-height:1.55; letter-spacing:.01em}
@media (max-width:860px){
  .nfile{grid-template-columns:1fr}
  .nf-sleeve{border-radius:6px 6px 0 0; padding-left:44px}
  .nf-folder{border-radius:0 0 6px 6px; order:-1}
  .nf-photos{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:420px){ .nf-photos{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px} .nf-ev{display:none} }

/* ══ real boxes ══ */
.wh-boxes{display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:auto; bottom:0}
.wr{display:flex; align-items:flex-end; justify-content:center}
.wr.r1{width:100%} .wr.r2{width:74%; margin-bottom:-4px} .wr.r3{width:40%; margin-bottom:-4px}
.wr{flex-direction:row}
.wh-boxes{flex-direction:column}
.wr img{display:block; width:var(--w); height:auto; rotate:var(--r); box-shadow:0 14px 18px -14px rgba(40,25,5,.7); margin:0 -1px}
.wh{height:auto; padding-top:300px}
.wh-boxes{position:relative}


/* ══ nails: simple ══ */
.ab-nails{text-align:center}
.ab-nt{max-width:42ch; margin:clamp(14px,2.4vh,26px) auto 0}
.ab-nt p{margin:8px 0 0; font-family:var(--f-serif); font-size:clamp(24px,2.6vw,38px); line-height:1.15}
.nl-row{list-style:none; padding:0; margin:clamp(30px,5vh,50px) auto 0; max-width:1000px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px 28px; text-align:left}
.nl-row li{border-top:1px solid rgba(17,17,17,.25); padding-top:12px}
.nl-row b{display:block; font-family:var(--f-title); font-weight:400; text-transform:uppercase; color:var(--blue); font-size:clamp(18px,1.6vw,22px); line-height:1}
.nl-row span{display:block; margin-top:6px; font-size:14px; line-height:1.5}
.nl-reel{margin:clamp(50px,8vh,80px) calc(50% - 50vw) 0; text-align:left}
.nl-bar{display:flex; justify-content:space-between; align-items:center; padding:0 5vw 14px}
.nl-bar .kick{color:var(--ink)}
.nl-nav{display:flex; gap:8px}
.nl-nav button{all:unset; cursor:pointer; width:44px; height:44px; display:grid; place-items:center; background:#111; color:#fff; font-family:var(--f-mono); font-size:16px; transition:background .2s}
.nl-nav button:hover{background:var(--coral)}
.nl-nav button:focus-visible{outline:2px dashed var(--blue); outline-offset:3px}
.nl-strip{display:flex; align-items:flex-start; gap:clamp(10px,1.4vw,18px); overflow-x:auto; padding:0 5vw 6px; scroll-snap-type:x proximity; scroll-padding-inline:5vw; scrollbar-width:none;
  cursor:grab; overscroll-behavior-x:contain; outline:none; user-select:none; -webkit-user-select:none}
.nl-strip::-webkit-scrollbar{display:none}
.nl-strip.grabbing{cursor:grabbing; scroll-snap-type:none}
.nl-ph{all:unset; flex:0 0 auto; cursor:zoom-in; display:block; scroll-snap-align:start}
.nl-ph img{display:block; height:clamp(340px,58vh,560px); width:auto; aspect-ratio:4/5; object-fit:cover; filter:grayscale(.15) contrast(1.03); transition:filter .5s}
.nl-ph.sm img{height:clamp(240px,40vh,390px); margin-top:clamp(100px,18vh,170px)}
.nl-ph:hover img{filter:none}
.nl-ph span{display:block; margin-top:10px; font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase}
.nl-ph span b{font-weight:500; color:var(--coral)}
.nl-ph:focus-visible{outline:2px dashed var(--blue); outline-offset:4px}
.nl-prog{margin:18px 5vw 0; height:3px; border-radius:3px; background:rgba(17,17,17,.12); overflow:hidden}
.nl-prog i{display:block; height:100%; width:var(--p,20%); margin-left:var(--x,0%); background:linear-gradient(90deg,#9ca1a9,#fdfdfe 50%,#9ca1a9); transition:margin-left .15s}
@media (max-width:820px){ .nl-row{grid-template-columns:1fr 1fr} .nl-ph img{height:min(56vh,95vw)} .nl-ph.sm img{height:min(40vh,68vw); margin-top:12vh} }
@media (max-width:520px){ .nl-ph img{height:auto; width:72vw} .nl-ph.sm img{width:52vw; height:auto} }
@media (max-width:480px){ .nl-row{grid-template-columns:1fr} }

/* ══ case study breadcrumbs ══ */
.cs-anchor{display:block; height:0}
.crumbs{position:fixed; z-index:5; right:max(14px,2vw); top:50%; translate:0 -50%}
.crumbs ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; position:relative}
.crumbs ol::before{content:""; position:absolute; right:5px; top:10px; bottom:10px; width:2px; border-radius:2px; background:linear-gradient(180deg,#fdfdfe,#9ca1a9)}
.crumbs button{all:unset; cursor:pointer; display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:5px 0; position:relative}
.crumbs button::after{content:""; width:12px; height:12px; border-radius:50%; background:var(--bg); box-shadow:inset 0 0 0 2px #9ca1a9; flex:none; transition:background .3s, box-shadow .3s, scale .4s var(--spring)}
.crumbs .cn{font-family:var(--f-mono); font-size:10px; color:var(--coral); opacity:0; transition:opacity .3s}
.crumbs .ct{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); opacity:.45; transition:opacity .3s, color .3s}
.crumbs button:hover .ct{opacity:1}
.crumbs button.on .ct{opacity:1; color:var(--blue); font-weight:500}
.crumbs button.on .cn{opacity:1}
.crumbs button.on::after{background:var(--coral); box-shadow:inset 0 0 0 2px var(--coral); scale:1.15}
.crumbs button:focus-visible{outline:2px dashed var(--blue); outline-offset:3px}
@media (max-width:1180px){ .crumbs .ct{display:none} .crumbs button.on .ct, .crumbs button:hover .ct{display:inline; background:var(--bg); padding:2px 6px} }
@media (max-width:640px){ .crumbs{right:4px} .crumbs .cn, .crumbs .ct, .crumbs button.on .ct, .crumbs button:hover .ct{display:none} .crumbs button::after{width:9px; height:9px} .crumbs ol::before{right:3.5px} }


/* ══ nails: cut-out hands left & right ══ */
.hands-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr); gap:clamp(10px,2vw,30px); align-items:center;
  margin:clamp(20px,4vh,40px) calc(50% - 50vw) 0; padding:0 2vw}
.hands{display:flex; flex-direction:column}
.hand{all:unset; cursor:zoom-in; position:relative; display:block; width:min(100%,320px); margin-top:-18%;
  filter:drop-shadow(0 18px 18px rgba(30,20,10,.22)); transition:rotate .7s var(--spring), scale .6s var(--spring), translate .6s var(--spring)}
.hand:first-child{margin-top:0}
.hand img{display:block; width:100%; height:auto; pointer-events:none}

.hands.l .hand{align-self:flex-start; rotate:calc(-8deg + var(--i) * 7deg)}
.hands.l .hand:nth-child(2){align-self:flex-end}
.hands.r .hand{align-self:flex-end; rotate:calc(8deg - var(--i) * 7deg)}
.hands.r .hand:nth-child(2){align-self:flex-start}
.hand:hover{rotate:0deg; scale:1.05; z-index:3}
.hand span{position:absolute; left:50%; bottom:6%; translate:-50% 6px; padding:5px 8px 4px; background:#111; color:#fff; font-family:var(--f-mono); font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; opacity:0; transition:opacity .3s, translate .4s var(--spring)}
.hand:hover span,.hand:focus-visible span{opacity:1; translate:-50% 0}
.hand:focus-visible{outline:2px dashed var(--blue); outline-offset:4px}
.hands-mid{text-align:center; max-width:440px; justify-self:center}
.hands-mid .kick{color:var(--coral)}
.hm-intro{margin:10px 0 26px; font-family:var(--f-serif); font-size:clamp(24px,2.3vw,34px); line-height:1.15}
.hm-pts{list-style:none; margin:0; padding:0}
.hm-pts li{padding:14px 0; border-top:1px solid rgba(17,17,17,.2)}
.hm-pts b{display:block; font-family:var(--f-title); font-weight:400; text-transform:uppercase; color:var(--blue); font-size:clamp(20px,1.8vw,26px); line-height:1}
.hm-pts span{display:block; margin-top:6px; font-size:14.5px; line-height:1.5}
@media (max-width:900px){
  .hands-grid{grid-template-columns:1fr; margin-left:0; margin-right:0; padding:0}
  .hands{flex-direction:row; justify-content:center}
  .hand, .hand:first-child{width:36%; margin:0 -3%}
  .hands.l .hand,.hands.r .hand{align-self:center}
  .hands-mid{order:-1; margin-bottom:10px}
  .hands.r{order:2}
  .hand span{display:none}
}
