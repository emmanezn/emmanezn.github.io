html{scroll-behavior:smooth; -webkit-text-size-adjust:100%; overflow-x:clip}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body); font-weight:400; font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased; overflow-x:clip}
img{max-width:100%; display:block}
a{color:inherit}
button{font:inherit; color:inherit}
::selection{background:var(--red); color:#fff}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.wrap{max-width:var(--max); margin:0 auto; padding:0 var(--pad)}
.mono{font-family:var(--f-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase}
.big{font-family:var(--f-big); font-weight:400; text-transform:uppercase; line-height:.86; letter-spacing:-.005em; margin:0}
.fit{display:inline-block; white-space:nowrap; line-height:.8; font-size:20vw; vertical-align:top}
.grain{position:fixed; inset:-50%; z-index:90; pointer-events:none; opacity:.09;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{translate:0 0}33%{translate:-3% 2%}66%{translate:2% -3%}100%{translate:0 0}}

/* halftone photos */
.ht{position:relative; overflow:hidden; background:var(--ink)}
.ht img{width:100%; height:100%; object-fit:cover}
.ht::after{display:none; content:""; position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:.42;
  background-image:radial-gradient(circle, #000 36%, transparent 40%); background-size:4px 4px}
 
 
.ht.color img{filter:contrast(1.25) saturate(1.25)}

/* header */
.top{position:fixed; z-index:50; top:0; left:0; right:0; transition:background .3s, box-shadow .3s}
.top-in{display:flex; align-items:center; justify-content:space-between; gap:16px; height:64px}
.top.solid{background:rgba(239,236,230,.94); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); box-shadow:0 1px 0 rgba(12,12,14,.12)}
.logo{font-family:var(--f-big); font-size:26px; letter-spacing:.01em; text-decoration:none; text-transform:uppercase; line-height:1}
.logo b{color:var(--red); font-weight:400}
.nav{display:flex; gap:clamp(12px,2.4vw,32px); align-items:center}
.nav a{font-family:var(--f-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; text-decoration:none; padding:8px 0; position:relative}
.nav a::after{content:""; position:absolute; left:0; right:0; bottom:2px; height:2px; background:var(--red); scale:0 1; transform-origin:left; transition:scale .3s}
.nav a:hover::after, .nav a.on::after{scale:1 1}
.nav .hire{padding:9px 14px 8px; background:var(--ink); color:var(--paper)}
.nav .hire::after{display:none}
.nav .hire:hover{background:var(--red)}
.burger{all:unset; display:none; cursor:pointer; font-family:var(--f-big); font-size:22px; text-transform:uppercase; padding:8px 0}
@media (max-width:820px){
  .burger{display:block}
  .nav{position:fixed; inset:64px 0 auto 0; flex-direction:column; align-items:stretch; gap:0; background:var(--ink); padding:10px var(--pad) 24px; translate:0 -120%; transition:translate .4s cubic-bezier(.2,.8,.2,1)}
  .nav.open{translate:0 0}
  .nav a{font-family:var(--f-big); font-size:44px; line-height:1.05; color:var(--paper); letter-spacing:0; padding:6px 0}
  .nav a::after{display:none}
  .nav .hire{background:var(--red); font-family:var(--f-mono); font-size:13px; letter-spacing:.1em; margin-top:16px; text-align:center; padding:14px}
}

/* HERO */
.hero{position:relative; min-height:100svh; padding-top:78px; display:flex; flex-direction:column; overflow:hidden}
.hero > .wrap{width:100%}
.hero-meta{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-top:14px; padding-bottom:clamp(6px,1.4vh,14px); position:relative; z-index:3}
.hero-name{position:relative; margin-top:clamp(18px,3.4vh,40px)}
.hero-name .fit{color:var(--hn, var(--ink)); transform:scaleY(1.12); transform-origin:50% 0; margin-bottom:.1em}
.hero-cut{position:absolute; left:50%; bottom:-12%; translate:-50% 0; height:122%; aspect-ratio:var(--ar, .826); margin:0; max-width:none; pointer-events:none; z-index:2}
.hero-cut img{display:block; width:100%; height:100%; object-fit:contain; max-width:none; filter:contrast(1.35) saturate(1.3) brightness(1.04) drop-shadow(0 18px 24px rgba(0,0,0,.35))}
.hero-cut::after{display:none}
.hero-role{position:relative; z-index:3; color:var(--hr, var(--red)); margin-top:-.02em}
.hero-row{position:relative; z-index:3; display:grid; grid-template-columns:1.2fr 1fr; gap:24px; align-items:end; padding-top:clamp(18px,3vh,30px); padding-bottom:clamp(24px,4vh,40px); margin-top:auto}
.hero-row p{margin:0; max-width:520px; font-size:clamp(17px,1.4vw,20px); background:var(--paper); padding:4px 0}
.hero-ctas{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
.btn{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:10px; padding:15px 22px 14px; background:var(--ink); color:var(--paper);
  font-family:var(--f-big); font-size:clamp(18px,1.6vw,22px); text-transform:uppercase; letter-spacing:.02em; line-height:1; transition:background .2s, translate .2s}
.btn:hover{background:var(--red); translate:0 -2px}
.btn:focus-visible{outline:3px solid var(--red); outline-offset:3px}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink)}
.btn.ghost:hover{background:var(--ink); color:var(--paper)}
.btn.red{background:var(--red)} .btn.red:hover{background:var(--ink)}
.dot{width:9px; height:9px; border-radius:50%; background:#3fb67f; box-shadow:0 0 0 0 rgba(63,182,127,.6); animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(63,182,127,0)}100%{box-shadow:0 0 0 0 rgba(63,182,127,0)}}
.badge{display:inline-flex; align-items:center; gap:9px; padding:10px 14px 9px; background:var(--paper); box-shadow:inset 0 0 0 2px var(--ink)}
@media (max-width:820px){
  .hero{min-height:auto}
  .hero-row{grid-template-columns:1fr}
  .hero-ctas{justify-content:flex-start}
  .hero-cut{height:120%; bottom:-10%}
}

/* hero colour combos */
body[data-hc="black-red"]{--hn:var(--ink); --hr:var(--red)}
body[data-hc="red-black"]{--hn:var(--red); --hr:var(--ink)}
body[data-hc="blue-red"]{--hn:var(--blue); --hr:var(--red)}
body[data-hc="black-blue"]{--hn:var(--ink); --hr:var(--blue)}
body[data-hc="red-on-black"] .hero{background:var(--ink); color:var(--paper)}
body[data-hc="red-on-black"]{--hn:var(--red); --hr:var(--paper)}
body[data-hc="red-on-black"] .hero-row p{background:transparent}
body[data-hc="red-on-black"] .top:not(.solid){color:var(--paper)}
body[data-hc="red-on-black"] .top:not(.solid) .nav .hire{background:var(--red)}
body[data-hc="red-on-black"] .hero .btn{background:var(--red)}
body[data-hc="red-on-black"] .hero .badge{background:transparent; box-shadow:inset 0 0 0 2px var(--paper)}

/* ticker */
.tick{background:var(--ink); color:var(--paper); overflow:hidden; border-block:2px solid var(--ink); position:relative; z-index:4}
.tick-in{display:flex; width:max-content; animation:tick 30s linear infinite}
.tick span{font-family:var(--f-big); font-size:clamp(28px,4vw,56px); text-transform:uppercase; padding:10px 0 8px; white-space:nowrap; display:flex; align-items:center}
.tick span::after{content:"★"; color:var(--red); margin:0 .5em; font-size:.6em}
@keyframes tick{to{translate:-50% 0}}
.tick.red{background:var(--red); rotate:-1.5deg; margin:0 -2vw; border:0}
.tick.red span::after{color:var(--ink)}

/* sections */
.sec{padding:clamp(70px,12vh,140px) 0}
.sec-h .fit, .ct h2 .fit:first-child{margin-top:.07em}
.sec-h{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:clamp(34px,6vh,72px)}
.sec-h .fit{color:var(--ink)}
.kick{font-family:var(--f-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--red); display:block; margin-bottom:clamp(10px,1.6vh,18px)}
.lead{font-size:clamp(18px,1.6vw,22px); max-width:680px; margin:0}

/* WORK list */
.work{display:grid; gap:clamp(18px,3vw,36px)}
.wk{all:unset; cursor:pointer; display:grid; width:100%; box-sizing:border-box; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:clamp(16px,3vw,40px); align-items:stretch; border-top:3px solid var(--ink); padding-top:clamp(16px,2vw,24px)}
.wk:focus-visible{outline:3px solid var(--red); outline-offset:6px}
.wk-t{display:flex; flex-direction:column; gap:14px; min-width:0}
.wk-n{font-family:var(--f-mono); font-size:13px; color:var(--red)}
.wk h3{font-family:var(--f-big); font-weight:400; text-transform:uppercase; line-height:.86; margin:0; font-size:clamp(52px,8vw,128px); transition:color .25s}
.wk:hover h3{color:var(--blue)}
.wk p{margin:0; max-width:520px}
.wk-tags{display:flex; flex-wrap:wrap; gap:8px; margin-top:auto}
.wk-tags li{list-style:none; font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:6px 9px 5px; box-shadow:inset 0 0 0 1.5px var(--ink)}
.wk-tags{padding:0; margin:4px 0 0}
.wk-go{display:inline-flex; align-items:center; gap:8px; font-family:var(--f-big); font-size:22px; text-transform:uppercase}
.wk-go b{display:inline-block; transition:translate .25s; color:var(--red)}
.wk:hover .wk-go b{translate:8px 0}
.wk-img{width:100%; aspect-ratio:16/10; align-self:start; overflow:hidden; position:relative}
.wk-img img{transition:filter .5s, scale .8s cubic-bezier(.2,.8,.2,1), mix-blend-mode .5s}
.wk:hover .wk-img img{filter:none; mix-blend-mode:normal; scale:1.04}
.wk:hover .wk-img::after{opacity:0}
.wk-img::after{transition:opacity .5s}
.wk-stamp{position:absolute; z-index:2; top:14px; left:14px; background:var(--red); color:#fff; font-family:var(--f-big); font-size:18px; text-transform:uppercase; padding:7px 10px 5px; rotate:-4deg}
.wk.soon{cursor:default}
.wk.soon .wk-img{display:grid; place-items:center; background:var(--blue)}
.wk.soon .wk-img span{font-family:var(--f-big); font-size:clamp(40px,6vw,90px); color:var(--paper); text-transform:uppercase; line-height:.85; text-align:center; position:relative; z-index:1}
@media (max-width:820px){ .wk{grid-template-columns:1fr} .wk-img{order:-1; min-height:0} }

/* PROCESS */
.proc{background:var(--blue); color:var(--paper)}
.proc .sec-h .fit{color:var(--paper)}
.proc .kick{color:var(--coral)}
.proc-g{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(14px,2vw,28px); counter-reset:p}
.proc-g article{border-top:3px solid var(--paper); padding-top:16px}
.proc-g .pn{font-family:var(--f-big); font-size:clamp(80px,9vw,150px); line-height:.8; color:transparent; -webkit-text-stroke:2px var(--paper)}
.proc-g h3{font-family:var(--f-big); font-weight:400; font-size:clamp(34px,3.4vw,52px); text-transform:uppercase; margin:12px 0 10px; line-height:.9; color:var(--paper)}
.proc-g p{margin:0; font-size:16px; opacity:.9}
@media (max-width:980px){ .proc-g{grid-template-columns:1fr 1fr} }
@media (max-width:520px){ .proc-g{grid-template-columns:1fr} }

/* UI grid */
.ui-g{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(10px,1.6vw,22px); grid-auto-flow:dense}
.ui-i{all:unset; box-sizing:border-box; cursor:zoom-in; display:flex; flex-direction:column; gap:10px; min-width:0}
.ui-i.wide{grid-column:span 2}
.ui-f{background:var(--ink); aspect-ratio:4/3; overflow:hidden; box-shadow:0 0 0 2px var(--ink)}
.ui-i.wide .ui-f{aspect-ratio:auto; height:100%; max-height:none}
.ui-f.paper{background:#fff}
.ui-f img{width:100%; height:100%; object-fit:cover; object-position:top; transition:scale .6s cubic-bezier(.2,.8,.2,1)}
.ui-f.paper img{object-fit:contain; padding:8px}
.ui-i:hover .ui-f img{scale:1.03}
.ui-cap{display:flex; justify-content:space-between; gap:10px; font-family:var(--f-mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase}
.ui-cap b{font-weight:500} .ui-cap span{color:var(--red); text-align:right}
.ui-i:focus-visible{outline:3px solid var(--red); outline-offset:4px}
@media (max-width:820px){ .ui-g{grid-template-columns:1fr 1fr} }
@media (max-width:520px){ .ui-g{grid-template-columns:1fr} .ui-i.wide{grid-column:auto} }

/* project covers: blue halftone */
.wk-img.ht{background:var(--blue)}
.wk-img.ht img{filter:grayscale(1) contrast(1.45) brightness(1.06); mix-blend-mode:screen}
.wk-img.ht::after{display:block; content:""; position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:.42;
  background-image:radial-gradient(circle, #000 36%, transparent 40%); background-size:4px 4px}

/* SCREENS */
.scs{display:grid; gap:clamp(48px,8vh,90px)}
.sc-h{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; border-top:2px solid var(--ink); padding-top:14px; margin-bottom:16px}
.sc-h h3{font-family:var(--f-big); font-weight:400; text-transform:uppercase; font-size:clamp(28px,3vw,44px); line-height:1; margin:0}
.sc-h .mono{opacity:.65}
.sc-link{margin-left:auto; text-decoration:none; border-bottom:2px solid var(--red); padding-bottom:2px}
.sc-link:hover{color:var(--red)}
.sc-row{display:grid; gap:clamp(8px,1.2vw,16px)}
.sc-row.n2{grid-template-columns:1fr 1fr} .sc-row.n3{grid-template-columns:1fr 1fr 1fr} .sc-row.n1{grid-template-columns:1fr}
.sc-i{all:unset; box-sizing:border-box; cursor:zoom-in; display:block; aspect-ratio:16/10; overflow:hidden; background:#fff; box-shadow:0 0 0 1px rgba(12,12,14,.18)}
.sc-i img{width:100%; height:100%; object-fit:cover; object-position:top; transition:scale .6s cubic-bezier(.2,.8,.2,1)}
.sc-i:hover img{scale:1.03}
.sc-i:focus-visible{outline:3px solid var(--red); outline-offset:3px}
@media (max-width:700px){ .sc-row.n3,.sc-row.n2{grid-template-columns:1fr 1fr} .sc-row.n3 .sc-i:first-child{grid-column:1 / -1} .sc-link{margin-left:0} }

/* BEYOND */
.bey{background:var(--ink); color:var(--paper)}
.bey .sec-h .fit{color:var(--paper)} .bey .kick{color:var(--coral)}
.post-row{display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; padding:10px var(--pad) 22px; margin:0 calc(-1 * var(--pad)); overscroll-behavior-x:contain; scrollbar-width:thin}
.post{all:unset; cursor:zoom-in; flex:0 0 clamp(200px,24vw,340px); scroll-snap-align:start; transition:translate .3s, rotate .3s}
.post img{width:100%; height:auto; box-shadow:0 20px 30px -20px rgba(0,0,0,.8)}
.post:hover{translate:0 -6px; rotate:-1deg}
.post:focus-visible{outline:3px solid var(--red); outline-offset:4px}
.bey-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(14px,2vw,28px); margin-top:clamp(40px,7vh,80px)}
.bey-cards article{border-top:3px solid var(--paper); padding-top:14px}
.bey-cards h3{font-family:var(--f-big); font-weight:400; font-size:clamp(34px,3.4vw,52px); text-transform:uppercase; line-height:.9; margin:0 0 10px; color:var(--red)}
.bey-cards p{margin:0; opacity:.88}
.bey-photos{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:clamp(40px,7vh,80px)}
.bey-photos .ht{aspect-ratio:3/4}
@media (max-width:820px){ .bey-cards{grid-template-columns:1fr} .bey-photos{grid-template-columns:repeat(3,1fr)} .bey-photos .ht:nth-child(n+4){display:none} }

/* ABOUT */
.ab-g{display:grid; grid-template-columns:.9fr 1.1fr; gap:clamp(24px,5vw,80px); align-items:start}
.ab-pic{aspect-ratio:4/5; position:sticky; top:90px}
.ab-pic figcaption{position:absolute; z-index:2; left:14px; bottom:14px; background:var(--paper); color:var(--ink); padding:7px 10px 6px}
.ab-txt p{font-size:clamp(17px,1.35vw,20px); margin:0 0 1em}
.ab-txt p:first-of-type::first-line{font-weight:500}
.ab-facts{display:grid; grid-template-columns:auto 1fr; gap:8px 20px; margin:30px 0; padding:20px 0; border-block:2px solid var(--ink)}
.ab-facts dt{font-family:var(--f-mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--red); padding-top:3px}
.ab-facts dd{margin:0}
.chips{display:flex; flex-wrap:wrap; gap:7px; padding:0; margin:10px 0 24px}
.chips li{list-style:none; font-family:var(--f-mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; background:var(--ink); color:var(--paper); padding:7px 10px 6px}
.chips.line li{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink)}
.ab-h{font-family:var(--f-big); font-size:28px; text-transform:uppercase; margin:0}
.xp{display:grid; gap:0; margin:8px 0 28px}
.xp li{list-style:none; display:grid; grid-template-columns:120px 1fr; gap:14px; padding:12px 0; border-bottom:1px solid rgba(12,12,14,.18)}
.xp{padding:0}
.xp .w{font-family:var(--f-mono); font-size:12px; color:var(--red); padding-top:4px}
.xp b{font-family:var(--f-big); font-weight:400; font-size:24px; text-transform:uppercase; line-height:1; display:block}
.xp em{font-style:normal; font-size:15px; opacity:.75}
.cvrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.cvrow small{font-family:var(--f-mono); font-size:11px; opacity:.6}
@media (max-width:820px){ .ab-g{grid-template-columns:1fr} .ab-pic{position:relative; top:0; max-width:520px} .xp li{grid-template-columns:96px 1fr} }

/* CONTACT */
.ct{background:var(--red); color:var(--ink); padding-bottom:0}
.ct .fit{color:var(--ink)}
.ct .fit.w{color:var(--paper)}
.ct h2 .fit{display:block; width:max-content}
.ct-mail{display:inline-block; font-family:var(--f-big); font-size:clamp(34px,6.4vw,104px); text-transform:uppercase; text-decoration:none; line-height:1; margin:clamp(24px,4vh,44px) 0 10px; word-break:break-all; border-bottom:5px solid var(--ink)}
.ct-mail:hover{color:var(--paper); border-color:var(--paper)}
.ct-row{display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; align-items:center; margin-top:18px}
.ct-links{display:flex; gap:10px; flex-wrap:wrap}
.ct .btn.ghost{color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink)}
.ct .badge{background:var(--paper)}
.foot{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:clamp(40px,8vh,90px) 0 24px; font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase}

/* reveal */
.rv{opacity:0; translate:0 26px; transition:opacity .7s ease, translate .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1; translate:0 0}
@media (prefers-reduced-motion: reduce){ .rv{opacity:1; translate:none; transition:none} .tick-in,.grain,.dot{animation:none} html{scroll-behavior:auto} }

/* lightbox */
.lb{border:0; padding:0; background:transparent; max-width:96vw; max-height:94vh; overflow:visible}
.lb::backdrop{background:rgba(12,12,14,.92)}
.lb img{max-width:94vw; max-height:88vh; width:auto; height:auto; object-fit:contain; margin:auto}
.lb p{color:var(--paper); font-family:var(--f-mono); font-size:12px; text-transform:uppercase; letter-spacing:.08em; text-align:center; margin:10px 0 0}
.lb-x{all:unset; cursor:pointer; position:fixed; top:14px; right:16px; color:#fff; font-family:var(--f-big); font-size:22px; text-transform:uppercase; background:var(--red); padding:10px 14px 8px}

/* ═════════ CASE STUDY ═════════ */
.cs-view{display:none}
body.in-cs .home{display:none}
body.in-cs .cs-view{display:block}
.cs-bar{position:sticky; top:64px; z-index:40; background:var(--paper); border-bottom:2px solid var(--ink)}
.cs-bar-in{display:flex; align-items:center; gap:14px; height:56px}
.cs-back{all:unset; cursor:pointer; flex:none; display:inline-flex; align-items:center; gap:8px; background:var(--ink); color:var(--paper); font-family:var(--f-big); font-size:18px; text-transform:uppercase; padding:10px 14px 8px; line-height:1}
.cs-back:hover{background:var(--red)}
.cs-back:focus-visible{outline:3px solid var(--red); outline-offset:3px}
.cs-steps{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0}
.cs-steps::-webkit-scrollbar{display:none}
.cs-steps button{all:unset; cursor:pointer; flex:none; font-family:var(--f-mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; padding:8px 10px 7px; opacity:.55; transition:opacity .2s, background .2s}
.cs-steps button:hover{opacity:1}
.cs-steps button.on{opacity:1; background:var(--blue); color:#fff}
.cs-steps button:focus-visible{outline:2px solid var(--red)}
.cs{padding-top:clamp(40px,7vh,80px)}
.cs-hero .mono{color:var(--red)}
.cs-hero h1{text-wrap:balance; font-family:var(--f-big); font-weight:400; text-transform:uppercase; line-height:.88; font-size:clamp(46px,8.4vw,150px); margin:14px 0 clamp(24px,4vh,48px); max-width:14ch}
.cs-hero figure{margin:0 auto; max-width:1100px}
.cs-hero figure.paper{background:#fff; padding:clamp(10px,2vw,28px); box-shadow:0 0 0 2px var(--ink)}
.cs-hero figure img{width:100%; height:auto}
.blk{margin:clamp(56px,9vh,110px) 0}
.lab{font-family:var(--f-mono); font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--red); display:flex; align-items:center; gap:10px; margin:0 0 16px}
.lab::before{content:""; width:22px; height:3px; background:var(--red)}
.t2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr); gap:clamp(14px,4vw,60px); border-top:2px solid var(--ink); padding-top:20px; align-items:start}
.t2 .lab{padding-top:.35em}
.t2 .lab{margin:0}
.t2 p:not(.lab){margin:0; font-size:clamp(18px,1.45vw,21px); max-width:780px}
.t2.big p:not(.lab){font-family:var(--f-big); text-transform:uppercase; font-size:clamp(30px,3.6vw,58px); line-height:.98; color:var(--blue)}
.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:0; border-block:3px solid var(--ink)}
.facts div{padding:16px 18px 16px 0}
.facts div + div{padding-left:18px; border-left:1px solid rgba(12,12,14,.2)}
.facts dt{font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--red); margin-bottom:6px}
.facts dd{margin:0; font-size:15.5px; line-height:1.4}
.split{display:grid; grid-template-columns:1fr 1.15fr; gap:clamp(20px,4vw,64px); align-items:center}
.split.flip .sp-t{order:2}
.sp-t p{margin:0; font-size:clamp(17px,1.35vw,20px)}
.sp-t h3{font-family:var(--f-big); font-weight:400; text-transform:uppercase; font-size:clamp(34px,3.6vw,56px); line-height:.92; margin:0 0 14px}
.sp-f{margin:0; cursor:zoom-in}
.sp-f img{width:100%; height:auto; max-height:70vh; object-fit:cover; box-shadow:0 0 0 2px var(--ink)}
.sp-f figcaption,.fig figcaption{font-family:var(--f-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-top:8px; opacity:.7}
.sprints{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:0; margin:0}
.sprints li{list-style:none; background:var(--ink); color:var(--paper); padding:18px 16px 16px; display:flex; flex-direction:column; gap:8px}
.sprints .no{font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--coral)}
.sprints b{font-family:var(--f-big); font-weight:400; font-size:26px; text-transform:uppercase; line-height:.95}
.sprints p{margin:0; font-size:15px; opacity:.85}
.sprints .re{margin-top:auto; font-family:var(--f-mono); font-size:10.5px; color:var(--coral); text-transform:uppercase; letter-spacing:.08em}
.sh{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.sh div{padding:18px; box-shadow:inset 0 0 0 2px var(--ink)}
.sh div.key{background:var(--blue); color:#fff; box-shadow:none}
.sh h4{font-family:var(--f-big); font-weight:400; font-size:26px; text-transform:uppercase; margin:0}
.sh small{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.7}
.sh ul{display:flex; flex-wrap:wrap; gap:6px; padding:0; margin:12px 0 0}
.sh li{list-style:none; font-size:14px; padding:5px 10px; border-radius:99px; box-shadow:inset 0 0 0 1.5px currentColor}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0; border-block:3px solid var(--ink)}
.stats div{padding:20px 16px 18px 0}
.stats div + div{padding-left:16px; border-left:2px solid var(--ink)}
.stats b{display:block; font-family:var(--f-big); font-weight:400; font-size:clamp(64px,8vw,130px); line-height:.85; color:var(--red)}
.stats span{font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase}
.stats-after{font-family:var(--f-big); text-transform:uppercase; font-size:clamp(24px,2.6vw,40px); line-height:1.02; margin:26px 0 0; max-width:900px}
.quote{margin:0; text-align:center}
.quote p{font-family:var(--f-big); text-transform:uppercase; font-size:clamp(40px,6.6vw,110px); line-height:.9; margin:0 auto; color:var(--blue); max-width:14ch}
.quote p::before{content:"“"; color:var(--red)} .quote p::after{content:"”"; color:var(--red)}
.quote cite{display:block; font-style:normal; font-family:var(--f-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; margin-top:18px}
.emp{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.emp div{background:var(--paper2); padding:18px}
.emp h4{font-family:var(--f-big); font-weight:400; font-size:34px; text-transform:uppercase; margin:0 0 8px; color:var(--blue)}
.emp ul{margin:0; padding-left:18px} .emp li{margin:0 0 6px; font-size:15.5px}
.emp-p{font-family:var(--f-mono); font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin:0 0 12px}
.list{padding:0; margin:0; counter-reset:l; border-top:2px solid var(--ink)}
.list li{list-style:none; counter-increment:l; display:grid; grid-template-columns:56px 1fr; gap:10px; padding:14px 0; border-bottom:1px solid rgba(12,12,14,.2); font-size:clamp(17px,1.35vw,20px)}
.list li::before{content:counter(l, decimal-leading-zero); font-family:var(--f-big); font-size:28px; line-height:1; color:var(--red)}
.stm{border-top:3px solid var(--ink); padding-top:22px}
.stm .lab{margin-bottom:20px}
.stm h3{font-family:var(--f-big); font-weight:400; text-transform:uppercase; font-size:clamp(48px,7vw,120px); line-height:.86; margin:0; color:var(--ink)}
.stm h3 em{font-style:normal; color:var(--red)}
.stm p{font-size:clamp(17px,1.4vw,21px); margin:16px 0 0; max-width:780px}
.vers{display:grid; grid-template-columns:1fr 1fr; gap:clamp(14px,2.5vw,36px)}
.vers figure{margin:0; position:relative; cursor:zoom-in}
.vers img{width:100%; height:auto; box-shadow:0 0 0 2px var(--ink)}
.vers .stp{position:absolute; top:-12px; left:12px; font-family:var(--f-big); font-size:20px; text-transform:uppercase; padding:7px 11px 5px; background:var(--ink); color:#fff; rotate:-3deg}
.vers .win .stp{background:var(--red)}
.gal{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:clamp(8px,1.4vw,18px)}
.gal figure{margin:0}
.gal img{width:100%; aspect-ratio:4/3; object-fit:cover; box-shadow:0 0 0 2px var(--ink); cursor:zoom-in}
.gal figcaption{font-family:var(--f-big); font-size:clamp(18px,1.6vw,24px); text-transform:uppercase; line-height:1; margin-top:10px}
.pgs{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:clamp(12px,2vw,26px)}
.pgs figure{margin:0}
.pgs figcaption{font-family:var(--f-big); font-size:clamp(24px,2.2vw,34px); text-transform:uppercase; line-height:1; margin-bottom:10px}
.pgs-in{height:min(66vh,620px); overflow-y:auto; overscroll-behavior:contain; background:#fff; box-shadow:0 0 0 3px var(--ink)}
.pgs-in img{width:100%; height:auto}
.cs-hero figure.mock{max-width:1200px; margin:0 auto}
.cs-hero figure.mock img{filter:drop-shadow(0 30px 40px rgba(0,0,0,.22))}
.scrollf{height:min(80vh,760px); overflow-y:auto; box-shadow:0 0 0 3px var(--ink); max-width:900px; margin:0 auto; overscroll-behavior:contain; background:#fff}
.scrollf img{width:100%; height:auto}
.scrollnote{text-align:center; font-family:var(--f-mono); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin-top:10px}
.fig{margin:0; cursor:zoom-in}
.fig img{width:100%; height:auto; box-shadow:0 0 0 2px var(--ink)}
.fig.narrow{max-width:860px; margin:0 auto}
.dirs{display:grid; gap:clamp(40px,6vh,70px)}
.dir h4{font-family:var(--f-big); font-weight:400; text-transform:uppercase; font-size:clamp(36px,4.4vw,70px); line-height:.9; margin:0}
.dir h4 span{color:var(--red); font-size:.5em; vertical-align:top; margin-right:8px}
.dir p{margin:6px 0 16px; font-size:17px}
.dir img{width:100%; max-width:1000px; height:auto; cursor:zoom-in}
.built p{font-size:clamp(17px,1.4vw,21px); max-width:820px; margin:0 0 20px}
.collage{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px}
.collage img{width:100%; height:100%; aspect-ratio:1; object-fit:cover; box-shadow:0 0 0 2px var(--ink); cursor:zoom-in}
.collage img:first-child{grid-column:span 2; aspect-ratio:2/1}
.cs-next{all:unset; box-sizing:border-box; width:100%; cursor:pointer; display:block; background:var(--blue); color:var(--paper); margin-top:clamp(70px,12vh,140px); padding:clamp(40px,8vh,90px) 0}
.cs-next .mono{color:var(--coral)}
.cs-next b{display:block; font-family:var(--f-big); font-weight:400; text-transform:uppercase; font-size:clamp(56px,10vw,180px); line-height:.86; margin-top:10px}
.cs-next:hover b{color:var(--red)}
.cs-soon{border:3px solid var(--ink); padding:clamp(20px,4vw,50px); margin-top:30px}
.cs-soon b{font-family:var(--f-big); font-weight:400; font-size:clamp(40px,6vw,90px); text-transform:uppercase; line-height:.9; color:var(--red); display:block; margin-bottom:12px}
@media (max-width:820px){
  .t2{grid-template-columns:1fr}
  .split{grid-template-columns:1fr} .split.flip .sp-t{order:0}
  .sprints{grid-template-columns:1fr 1fr}
  .sh,.emp{grid-template-columns:1fr}
  .vers{grid-template-columns:1fr; gap:28px}
  .facts div + div, .stats div + div{border-left:0; padding-left:0; border-top:1px solid rgba(12,12,14,.2)}
}
</style>
</head>
<body>
<script>document.body.dataset.hc = (new URLSearchParams(location.search).get("colors")) || CONFIG.heroColors || "black-red";</script>

<header class="top" id="top">
  <div class="wrap top-in">
    <a class="logo" href="#" data-home>Emma<b>★</b>N</a>
    <button class="burger" id="burger" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#work">Work</a><a href="#ui">UI</a><a href="#beyond">Beyond UX</a><a href="#about">About</a><a class="hire" href="#contact">Contact</a>
    </nav>
  </div>
</header>

<div class="home" id="home"></div>
<div class="cs-view" id="csv"></div>

<dialog class="lb" id="lb" aria-label="Image"><img id="lb-img" alt=""><p id="lb-cap"></p><button class="lb-x" id="lb-x" type="button">Close ✕</button></dialog>

<script>
(() => {
  const C = CONFIG;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const u = p => !p ? '' : /^(https?:|data:|\/)/.test(p) ? p : BASE + p;
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const projects = (C.projects || []).filter(p => p.title && (p.summary || (p.caseStudy || []).length));

  /* ── fit text: every .fit fills its parent's width exactly ── */
  function fitAll(root = document) {
    root.querySelectorAll('.fit').forEach(el => {
      const box = el.parentElement.clientWidth; if (!box) return;
      el.style.fontSize = '100px';
      const w = el.scrollWidth || 1;
      el.style.fontSize = (100 * box / w * .995) + 'px';
    });
  }

  /* ── HOME ── */
  function homeHTML() {
    const h = C.hero || {};
    const tick = (C.ticker || []).map(t => `<span>${esc(t)}</span>`).join('');
    const workList = projects.map((p, i) => {
      const has = (p.caseStudy || []).length;
      const tags = (p.meta || '').split('·').map(t => t.trim()).filter(Boolean).slice(0, 4);
      return `<button type="button" class="wk rv${has ? '' : ' soon'}" ${has ? `data-cs="${esc(p.id)}"` : 'aria-disabled="true"'}>
        <div class="wk-t">
          <span class="wk-n">${String(i + 1).padStart(2, '0')} / ${esc(p.year || '')} · ${p.status === 'ongoing' ? 'In progress' : 'Finished'}</span>
          <h3>${esc(p.title)}</h3>
          <p>${esc(p.summary || '')}</p>
          <ul class="wk-tags">${tags.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
          ${has ? '<span class="wk-go">Read the case study <b>→</b></span>' : ''}
        </div>
        ${has ? `<div class="wk-img ht blue">${p.status === 'ongoing' ? '<span class="wk-stamp">In progress</span>' : ''}<img src="${esc(u(p.cover))}" alt="" loading="lazy"></div>`
              : `<div class="wk-img"><span>Case study<br>coming soon</span></div>`}
      </button>`; }).join('');
    const proc = (C.process || []).map((s, i) => `<article class="rv"><div class="pn">0${i + 1}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></article>`).join('');
    const ui = (C.screens || []).map(g => `<article class="sc rv">
        <header class="sc-h"><h3>${esc(g.title)}</h3><span class="mono">${esc(g.type)}</span>${g.link ? `<a class="sc-link mono" href="${esc(u(g.link))}" target="_blank" rel="noopener">Visit ↗</a>` : ''}</header>
        <div class="sc-row n${(g.images || []).length}">${(g.images || []).map(src => `<button type="button" class="sc-i" data-lb="${esc(u(src))}" data-cap="${esc(g.title)}"><img src="${esc(u(src))}" alt="${esc(g.title)} screen" loading="lazy"></button>`).join('')}</div>
      </article>`).join('');
    const b = C.beyond || {};
    const a = C.about || {};
    const xp = (C.experience || []).flatMap(bl => bl.items.map(it => ({ ...it, group: bl.title })));
    const links = (C.links || []).filter(l => l.url);
    return `
    <section class="hero" id="hello">
      <div class="wrap hero-meta mono"><span>Portfolio ’26</span><span>${esc(C.location)}</span></div>
      <div class="wrap hero-name">
        <h1 class="big"><span class="fit" aria-label="${esc(C.name + ' ' + C.surname)}">${esc(C.name)}</span></h1>
        ${h.cutout ? `<figure class="hero-cut" style="--m:url('${esc(u(h.cutout))}')" aria-hidden="true"><img src="${esc(u(h.cutout))}" alt=""></figure>` : ''}
      </div>
      <div class="wrap"><p class="big hero-role"><span class="fit">${esc(C.role)}</span></p></div>
      <div class="wrap hero-row">
        <p>${esc(h.intro)}</p>
        <div class="hero-ctas"><span class="badge mono">${esc(C.availability)}</span><a class="btn" href="#work">${esc(h.cta || 'See the work')} ↓</a></div>
      </div>
    </section>

    <section class="sec" id="work"><div class="wrap">
      <div class="sec-h"><div style="flex:1;min-width:0"><span class="kick">01 — Selected work</span><h2 class="big"><span class="fit">Case studies</span></h2></div></div>
      <div class="work">${workList}</div>
    </div></section>

    <section class="sec proc" id="process"><div class="wrap">
      <div class="sec-h"><div style="flex:1;min-width:0"><span class="kick">02 — How I work</span><h2 class="big"><span class="fit">Research first</span></h2></div></div>
      <div class="proc-g">${proc}</div>
    </div></section>

    <section class="sec" id="ui"><div class="wrap">
      <div class="sec-h"><div style="flex:1;min-width:0"><span class="kick">03 — UI &amp; visual design</span><h2 class="big"><span class="fit">Screens</span></h2></div></div>
      <p class="lead rv" style="margin-bottom:clamp(30px,5vh,56px)">Visual and interface work from client, school and self-initiated projects. Click a screen to see it big.</p>
      <div class="scs">${ui}</div>
    </div></section>


    <section class="sec bey" id="beyond"><div class="wrap">
      <div class="sec-h"><div style="flex:1;min-width:0"><span class="kick">04 — Beyond UX</span><h2 class="big"><span class="fit">Off the clock</span></h2></div></div>
      <p class="lead rv">${esc(b.intro || '')}</p>
      <p class="mono" style="margin:clamp(28px,5vh,50px) 0 0;color:var(--coral)">Posters · scroll sideways →</p><div class="post-row">${(b.posters || []).map(p => `<button type="button" class="post" data-lb="${esc(u(p))}" data-cap="Poster"><img src="${esc(u(p))}" alt="Poster" loading="lazy"></button>`).join('')}</div>
      <div class="bey-cards">${(b.cards || []).map(c => `<article class="rv"><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></article>`).join('')}</div>
    </div></section>

    <section class="sec" id="about"><div class="wrap">
      <div class="sec-h"><div style="flex:1;min-width:0"><span class="kick">05 — About</span><h2 class="big"><span class="fit">Hi, I'm Emma</span></h2></div></div>
      <div class="ab-g">
        <figure class="ab-pic ht red" style="margin:0"><img src="${esc(u(a.portrait))}" alt="Emma Neznikova" loading="lazy"><figcaption class="mono">That's me ★</figcaption></figure>
        <div class="ab-txt rv">
          ${(a.text || []).map(t => `<p>${esc(t)}</p>`).join('')}
          <dl class="ab-facts">${(a.facts || []).map(f => `<dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd>`).join('')}</dl>
          <h3 class="ab-h">Experience</h3>
          <ul class="xp">${xp.map(it => `<li><span class="w">${esc(it.when || '')}</span><div><b>${esc(it.what)}</b><em>${esc(it.where || '')}</em></div></li>`).join('')}</ul>
          <h3 class="ab-h">Skills</h3><ul class="chips">${(a.skills || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
          <h3 class="ab-h">Tools</h3><ul class="chips line">${(a.tools || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
          <div class="cvrow">${a.cv ? `<a class="btn" href="${esc(u(a.cv))}" target="_blank" rel="noopener">View CV ↗</a><a class="btn ghost" href="${esc(u(a.cv))}" download>Download CV ↓</a>`
            : `<span class="btn" aria-disabled="true" style="opacity:.45;cursor:default">View CV ↗</span><span class="btn ghost" aria-disabled="true" style="opacity:.45;cursor:default">Download CV ↓</span><small>CV coming soon</small>`}</div>
        </div>
      </div>
    </div></section>

    <section class="sec ct" id="contact"><div class="wrap">
      <span class="kick" style="color:var(--ink)">06 — Contact</span>
      <h2 class="big"><span class="fit">Let's work</span><span class="fit w" style="margin-top:.04em">together</span></h2>
      <a class="ct-mail" href="mailto:${esc(C.email)}">${esc(C.email)}</a>
      <div class="ct-row">
        <span class="badge mono">${esc(C.availability)} · ${esc(C.location)}</span>
        <div class="ct-links">
          <button type="button" class="btn" id="copy">Copy email</button>
          ${links.map(l => `<a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}
        </div>
      </div>
      <div class="foot"><span>© ${new Date().getFullYear()} Emma Neznikova</span><span>Designed by me · built with AI</span><a href="#hello">Back to top ↑</a></div>
    </div></section>`;
  }

  /* ── CASE STUDY BLOCKS ── */
  const P = t => esc(t);
  const lab = l => l ? `<p class="lab">${esc(l)}</p>` : '';
  const img = (src, alt = '', cls = '') => src ? `<img src="${esc(u(src))}" alt="${esc(alt)}" loading="lazy" class="${cls}" data-lb="${esc(u(src))}" data-cap="${esc(alt)}">` : '';
  const B = {
    hero: (b, p) => `<header class="cs-hero"><span class="mono">${esc(p.meta || '')}</span><h1>${esc(b.title || p.title)}</h1>
        ${b.image ? `<figure class="${b.paper ? 'paper' : /\.png$/.test(b.image) ? 'mock' : ''}">${img(b.image, b.alt)}${b.caption ? `<figcaption class="mono" style="margin-top:8px">${esc(b.caption)}</figcaption>` : ''}</figure>` : ''}</header>`,
    facts: b => `<dl class="facts">${(b.items || []).map(f => `<div><dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd></div>`).join('')}</dl>`,
    text: b => `<div class="t2${b.big ? ' big' : ''}">${lab(b.label)}<p>${P(b.text)}</p></div>`,
    split: b => !b.image ? '' : `<div class="split${b.flip ? ' flip' : ''}"><div class="sp-t">${lab(b.label)}<p>${P(b.text)}</p></div>
        <figure class="sp-f">${img(b.image, b.alt)}${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure></div>`,
    sprints: b => `${lab(b.label)}<ol class="sprints">${(b.items || []).map(s => `<li><span class="no">${esc(s.no)}</span><b>${esc(s.goal)}</b><p>${esc(s.note)}</p>${s.retro ? `<span class="re">${esc(s.retro)}</span>` : ''}</li>`).join('')}</ol>`,
    stakeholders: b => `${lab(b.label)}<div class="sh">${(b.quadrants || []).map(q => `<div class="${q.key ? 'key' : ''}"><h4>${esc(q.title)}</h4><small>${esc(q.note)}</small><ul>${(q.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div>`,
    stats: b => `<div class="stats">${(b.items || []).map(s => `<div><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('')}</div>${b.after ? `<p class="stats-after">${esc(b.after)}</p>` : ''}`,
    quote: b => `<blockquote class="quote"><p>${esc(b.text)}</p>${b.by ? `<cite>— ${esc(b.by)}</cite>` : ''}</blockquote>`,
    empathy: b => `${lab(b.title)}${b.persona ? `<p class="emp-p">${esc(b.persona)}</p>` : ''}<div class="emp">${(b.quadrants || []).map(q => `<div><h4>${esc(q.label)}</h4><ul>${(q.notes || []).map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>`).join('')}</div>`,
    list: b => `${lab(b.label)}<ol class="list">${(b.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ol>`,
    statement: b => `<div class="stm">${lab(b.label)}<h3>${esc((b.lines || [])[0] || '')}</h3>${(b.lines || []).slice(1).map(l => `<p>${esc(l)}</p>`).join('')}</div>`,
    versions: b => `${lab(b.label)}${b.intro ? `<p style="margin:0 0 24px;font-size:18px">${esc(b.intro)}</p>` : ''}<div class="vers">${(b.items || []).map(v => `<figure class="${v.winner ? 'win' : ''}">${img(v.image, v.alt)}${v.stamp ? `<span class="stp">${esc(v.stamp)}</span>` : ''}</figure>`).join('')}</div>`,
    gallery: b => `${lab(b.label)}${b.note ? `<p style="margin:0 0 22px;max-width:720px;font-size:18px">${esc(b.note)}</p>` : ''}<div class="gal">${(b.items || []).map(it => `<figure>${img(it.image, it.caption)}${it.caption ? `<figcaption>${esc(it.caption)}</figcaption>` : ''}</figure>`).join('')}</div>`,
    pages: b => `${lab(b.label)}<div class="pgs">${(b.items || []).map(it => `<figure><figcaption>${esc(it.title)}</figcaption><div class="pgs-in" tabindex="0" aria-label="${esc(it.title)} page, scrollable"><img src="${esc(u(it.image))}" alt="${esc(it.title)} page" loading="lazy"></div></figure>`).join('')}</div>${b.note ? `<p class="scrollnote">${esc(b.note)}</p>` : ''}`,
    scroll: b => `${lab(b.label)}<div class="scrollf" tabindex="0" aria-label="${esc(b.alt || 'Scrollable design')}"><img src="${esc(u(b.image))}" alt="${esc(b.alt || '')}" loading="lazy"></div>${b.note ? `<p class="scrollnote">${esc(b.note)}</p>` : ''}`,
    link: b => `<div class="t2">${lab(b.label)}<div><p style="margin-bottom:18px">${esc(b.text || '')}</p><a class="btn red" href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.button || 'Open ↗')}</a></div></div>`,
    image: b => `<figure class="fig${b.wide ? '' : ' narrow'}">${img(b.image, b.alt)}${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure>`,
    directions: b => `${lab(b.label)}${b.note ? `<p style="margin:0 0 30px;max-width:720px;font-size:18px">${esc(b.note)}</p>` : ''}<div class="dirs">${(b.items || []).map((d, i) => `<div class="dir"><h4><span>0${i + 1}</span>${esc(d.title)}</h4><p>${esc(d.text)}</p>${img(d.image, d.title + ' storyboard')}</div>`).join('')}</div>`,
    built: b => `<div class="built">${lab(b.label)}<p>${esc(b.text)}</p><div class="collage">${(b.images || []).map(i => img(i.image, i.alt)).join('')}</div></div>`,
  };

  function caseHTML(p) {
    const blocks = p.caseStudy || [];
    const steps = [...new Set(blocks.map(b => b.step).filter(Boolean))];
    let last = null;
    const body = blocks.length ? blocks.map(b => {
      let a = '';
      if (b.step && b.step !== last) { last = b.step; a = `<span class="cs-anchor" data-step="${esc(b.step)}"></span>`; }
      const html = (B[b.type] || (() => ''))(b, p);
      return html ? a + (b.type === 'hero' ? html : `<section class="blk rv">${html}</section>`) : a;
    }).join('') : `${B.hero({ title: p.title }, p)}<div class="cs-soon"><b>In progress</b><p>${esc(p.summary || '')}</p></div>`;
    const i = projects.indexOf(p), next = projects[(i + 1) % projects.length];
    return `<div class="cs-bar"><div class="wrap cs-bar-in"><button type="button" class="cs-back" data-home>← All work</button>
        ${steps.length > 1 ? `<nav class="cs-steps" aria-label="Case study phases">${steps.map((s, k) => `<button type="button" data-step="${esc(s)}">${String(k + 1).padStart(2, '0')} ${esc(s)}</button>`).join('')}</nav>` : ''}</div></div>
      <article class="wrap cs">${body}</article>
      ${next && next !== p ? `<button type="button" class="cs-next" data-cs="${esc(next.id)}"><div class="wrap"><span class="mono">Next project →</span><b>${esc(next.title)}</b></div></button>` : ''}`;
  }

  /* ── routing ── */
  const home = $('home'), csv = $('csv');
  home.innerHTML = homeHTML();
  let curCs = null;
  function route() {
    const m = location.hash.match(/^#work\/([\w-]+)/);
    const p = m && projects.find(x => x.id === m[1]);
    if (p) {
      if (curCs !== p.id) { csv.innerHTML = caseHTML(p); curCs = p.id; reveal(csv); wireSteps(); }
      document.body.classList.add('in-cs'); window.scrollTo(0, 0); fitAll(csv);
      document.title = `${p.title} — Emma Neznikova`;
    } else {
      const was = document.body.classList.contains('in-cs');
      document.body.classList.remove('in-cs'); curCs = null; csv.innerHTML = '';
      document.title = 'Emma Neznikova — UX/UI Designer';
      fitAll(home);
      const id = location.hash.slice(1);
      const t = id && document.getElementById(id);
      if (t) requestAnimationFrame(() => t.scrollIntoView({ behavior: was || RM ? 'auto' : 'smooth' }));
      else if (was) { const w = $('work'); w && w.scrollIntoView(); }
    }
  }
  addEventListener('hashchange', route);
  document.addEventListener('click', e => {
    const cs = e.target.closest('[data-cs]');
    if (cs) { e.preventDefault(); location.hash = 'work/' + cs.dataset.cs; return; }
    const h = e.target.closest('[data-home]');
    if (h) { e.preventDefault(); if (document.body.classList.contains('in-cs')) { history.pushState(null, '', '#work'); route(); } else { history.pushState(null, '', location.pathname); scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }); } return; }
    const l = e.target.closest('[data-lb]');
    if (l) { e.preventDefault(); openLb(l.dataset.lb, l.dataset.cap || ''); return; }
    const a = e.target.closest('a[href^="#"]');
    if (a) { $('nav').classList.remove('open'); $('burger').setAttribute('aria-expanded', 'false'); }
  });

  /* case-study phase bar */
  let stepObs;
  function wireSteps() {
    stepObs?.disconnect();
    const btns = [...csv.querySelectorAll('.cs-steps button')];
    if (!btns.length) return;
    const anchors = [...csv.querySelectorAll('.cs-anchor')];
    btns.forEach(b => b.addEventListener('click', () => {
      const a = anchors.find(x => x.dataset.step === b.dataset.step);
      if (a) scrollTo({ top: a.getBoundingClientRect().top + scrollY - 130, behavior: RM ? 'auto' : 'smooth' });
    }));
    const set = () => {
      let cur = anchors[0]?.dataset.step;
      anchors.forEach(a => { if (a.getBoundingClientRect().top < innerHeight * .4) cur = a.dataset.step; });
      btns.forEach(b => { const on = b.dataset.step === cur; b.classList.toggle('on', on); if (on) b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); });
    };
    stepObs = { disconnect: () => removeEventListener('scroll', set) };
    addEventListener('scroll', set, { passive: true }); set();
  }

  /* reveal on scroll */
  let io;
  function reveal(root) {
    const els = root.querySelectorAll('.rv');
    if (RM || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
    io = io || new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -6% 0px', threshold: .06 });
    els.forEach(e => io.observe(e));
  }
  reveal(home);

  /* header + menu */
  const top = $('top');
  const onScroll = () => top.classList.toggle('solid', scrollY > 20 || document.body.classList.contains('in-cs'));
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
  $('burger').addEventListener('click', () => { const o = $('nav').classList.toggle('open'); $('burger').setAttribute('aria-expanded', String(o)); $('burger').textContent = o ? 'Close' : 'Menu'; });

  /* lightbox */
  const lb = $('lb');
  function openLb(src, cap) { $('lb-img').src = src; $('lb-img').alt = cap; $('lb-cap').textContent = cap; lb.showModal(); }
  $('lb-x').addEventListener('click', () => lb.close());
  lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });

  /* copy email */
  $('copy')?.addEventListener('click', async e => {
    try { await navigator.clipboard.writeText(C.email); } catch (_) {}
    e.target.textContent = 'Copied ★'; setTimeout(() => e.target.textContent = 'Copy email', 1600);
  });

  /* fit text once fonts are in, and on resize */
  let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => fitAll(), 120); });
  (document.fonts?.ready || Promise.resolve()).then(() => fitAll());
  route();
  setTimeout(() => fitAll(), 400);
})();
</script>
</body>
</html>
