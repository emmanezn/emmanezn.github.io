.abp-cv{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
.abp-cv a{font-family:var(--f-mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; text-decoration:none; padding:11px 13px 10px; background:var(--abp-t); color:var(--abp)}
.abp-cv a + a{background:transparent; color:var(--abp-t); box-shadow:inset 0 0 0 1.5px var(--abp-t)}
.abp-cv a:hover{background:var(--red); color:var(--paper); box-shadow:none}
@media (max-width:820px){ .hero-role{width:88%; margin-top:.45em !important} }
@media (max-width:1000px){ .abp-bot{grid-template-columns:1fr 1fr} }
@media (max-width:760px){ .abp{min-height:0} .abp-pk{padding:96px 16px 30px} .abp-big{font-size:23vw} .abp-sig{right:18px} .abp-bot{margin-top:70px; grid-template-columns:1fr; font-size:15px} }


/* ── personality strip ── */
.me-tick{background:var(--ink); border-block:0}
.me-tick .tick-in{animation-duration:48s}
.me-tick span{font-size:clamp(24px,3vw,42px)}
/* ── playground button ── */
.pg-cta{display:flex; align-items:center; gap:clamp(18px,3vw,44px); margin-top:clamp(50px,8vh,90px); padding:clamp(18px,2.4vw,30px); background:var(--paper); color:var(--ink); text-decoration:none; position:relative; transition:background .3s}
.pg-cta::before{content:""; position:absolute; inset:6px; border:1px dashed rgba(17,17,17,.3); pointer-events:none}
.pg-cta-pics{display:flex; flex:0 0 auto; padding-left:12px}
.pg-cta-pics img{width:clamp(70px,8vw,120px); aspect-ratio:4/5; object-fit:cover; background:#fff; padding:4px; margin-left:-14px; box-shadow:0 10px 20px -12px rgba(0,0,0,.6); transition:rotate .5s cubic-bezier(.3,1.4,.5,1), translate .5s cubic-bezier(.3,1.4,.5,1)}
.pg-cta-pics img:nth-child(1){rotate:-8deg} .pg-cta-pics img:nth-child(2){rotate:4deg; translate:0 -6px} .pg-cta-pics img:nth-child(3){rotate:10deg}
.pg-cta:hover .pg-cta-pics img:nth-child(1){rotate:-14deg; translate:-8px 0} .pg-cta:hover .pg-cta-pics img:nth-child(3){rotate:16deg; translate:8px 0}
.pg-cta-t{display:flex; flex-direction:column; gap:6px}
.pg-cta-t .mono{color:var(--red)}
.pg-cta-t b{font-family:var(--f-big); font-weight:400; text-transform:uppercase; font-size:clamp(34px,4.6vw,72px); line-height:.9}
.pg-cta-t em{font-family:"Pen",cursive; font-style:normal; font-size:clamp(22px,2vw,30px); color:var(--blue); line-height:1}
.pg-cta:hover{background:#fff} .pg-cta:hover b{color:var(--red)}
@media (max-width:600px){ .pg-cta{flex-direction:column; align-items:flex-start} }

.abp-photo{position:absolute; z-index:1; display:block; object-fit:cover; object-position:50% 28%; filter:contrast(1.04)}

/* ── CONTACT: message slip ── */
.ct-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:clamp(30px,5vw,80px); align-items:start; margin-top:clamp(26px,4vh,46px)}
.ct-intro{margin:0; max-width:560px; font-size:clamp(17px,1.4vw,21px); line-height:1.5}
.ct-grid .ct-mail{font-size:clamp(30px,4.2vw,72px); word-break:break-word; overflow-wrap:anywhere}
.slip{position:relative; background:var(--paper); color:var(--ink); padding:26px clamp(20px,2.4vw,32px) 24px; box-shadow:0 30px 50px -30px rgba(20,10,40,.55)}
.slip::before{content:""; position:absolute; left:0; right:0; top:-9px; height:10px; background:radial-gradient(circle at 7px 0, transparent 6px, var(--paper) 6.5px) 0 0/14px 10px repeat-x}
.slip-top{display:flex; justify-content:space-between; padding:2px 64px 14px 0; border-bottom:2px dashed rgba(17,17,17,.25); font-family:var(--f-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase}
.slip-no{color:var(--red)}
.slip-stamp{position:absolute; top:12px; right:16px; width:56px; color:var(--red); opacity:.85; transition:rotate .8s cubic-bezier(.3,1.4,.5,1)}
.slip:hover .slip-stamp{rotate:72deg}
.slip fieldset{border:0; margin:18px 0 0; padding:0}
.slip legend,.slip-f > span{display:block; margin-bottom:9px; font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:.7}
.slip-chips{display:flex; flex-wrap:wrap; gap:8px}
.slip-chips label{cursor:pointer}
.slip-chips input{position:absolute; opacity:0; pointer-events:none}
.slip-chips span{display:inline-block; padding:8px 12px 7px; border:1.5px solid var(--ink); border-radius:999px; font-size:14px; transition:background .2s, color .2s, rotate .4s cubic-bezier(.3,1.4,.5,1)}
.slip-chips label:hover span{background:rgba(46,46,163,.08)}
.slip-chips input:checked + span{background:var(--blue); border-color:var(--blue); color:#fff; rotate:-3deg}
.slip-chips input:focus-visible + span{outline:2px dashed var(--red); outline-offset:2px}
.slip-f{display:block; margin-top:18px}
.slip-f input,.slip-f textarea{width:100%; box-sizing:border-box; border:0; border-bottom:1.5px solid var(--ink); background:transparent; padding:6px 0 8px; font:inherit; font-size:17px; color:var(--ink); outline:none; border-radius:0}
.slip-f textarea{resize:vertical; min-height:136px; background-image:repeating-linear-gradient(transparent 0 33px, rgba(46,46,163,.22) 33px 34px); line-height:34px; border-bottom:0; padding-top:0}
.slip-f input:focus{border-color:var(--red)}
.slip-go{all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:12px; width:100%; box-sizing:border-box; margin-top:20px; padding:17px 20px 15px; background:var(--ink); color:var(--paper); font-family:var(--f-big); font-size:24px; text-transform:uppercase; letter-spacing:.02em; transition:background .25s}
.slip-go .slip-st{color:var(--red); display:inline-block; transition:rotate .7s cubic-bezier(.3,1.4,.5,1), color .25s}
.slip-go:hover{background:var(--blue)} .slip-go:hover .slip-st{rotate:144deg; color:#fff}
.slip-go b{font-weight:400; transition:translate .3s} .slip-go:hover b{translate:6px 0}
.slip-go:focus-visible{outline:3px dashed var(--paper); outline-offset:4px}
.slip-note{margin:12px 0 0; font-family:var(--f-mono); font-size:11px; opacity:.6; text-align:center}
.slip.sent .slip-note{opacity:1; color:var(--blue)}
@media (max-width:900px){ .ct-grid{grid-template-columns:1fr} }

.ct-grid:has(.mf1){grid-template-columns:1fr}
.mf1{border-top:3px solid var(--ink); padding-top:clamp(24px,4vh,40px)}
.mf1-line{margin:0; font-family:var(--f-big); text-transform:uppercase; font-size:clamp(34px,5.4vw,88px); line-height:1.12; color:var(--ink)}
.mf1-line input{font:inherit; color:var(--paper); background:transparent; border:0; border-bottom:4px solid var(--paper); outline:none; padding:0 .08em; margin:0 .05em; min-width:3ch; max-width:100%; text-transform:uppercase}
.mf1-line input::placeholder{color:rgba(239,236,230,.5)}
.mf1-line input:focus{border-color:var(--ink); color:var(--paper)}
.mf1-msg{display:block; margin-top:28px; max-width:820px}
.mf1-msg span{display:block; font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:8px}
.mf1-msg textarea{width:100%; box-sizing:border-box; background:transparent; border:0; border-bottom:2px solid var(--ink); font:inherit; font-size:19px; color:var(--ink); outline:none; resize:vertical; padding:4px 0}
.mf1-msg textarea::placeholder{color:rgba(12,12,14,.5)}
.mf-go{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:18px; margin-top:30px; padding:20px 34px 17px; background:var(--ink); color:var(--paper); font-family:var(--f-big); font-size:clamp(28px,3vw,44px); text-transform:uppercase; transition:background .25s}
.mf-go b{font-weight:400; color:var(--red); display:inline-block; transition:rotate .7s cubic-bezier(.3,1.4,.5,1)}
.mf-go:hover{background:var(--paper); color:var(--ink)} .mf-go:hover b{rotate:144deg}
.mf1 .slip-note{text-align:left}

.mf1-k{display:flex; align-items:center; gap:12px; margin:0 0 clamp(14px,2vh,22px); font-family:var(--f-mono); font-size:13px; letter-spacing:.1em; text-transform:uppercase}
.mf1-ic{display:inline-grid; place-items:center; width:34px; height:34px; background:var(--ink); color:var(--paper); font-size:17px; letter-spacing:0}
.mf1-end{display:flex; align-items:center; gap:clamp(16px,3vw,40px); flex-wrap:wrap; margin-top:30px}
.mf1-end .mf-go{margin-top:0}
.mf1-note{margin:0; max-width:420px; font-size:15px; line-height:1.45}
.mf1.sent .mf1-note{font-weight:500}

.hero-name .fit{position:relative; z-index:1}
.hero-star.big{z-index:0}
@media (max-width:760px){ .hero-star.big:nth-of-type(1){top:-18%} }
.hero-cut img{filter:contrast(1.15) saturate(1.1) drop-shadow(0 18px 24px rgba(0,0,0,.3)) !important}

.hero-star.big{z-index:0}
.hero-cut{z-index:4 !important}
.hero-name .fit{position:relative; z-index:3}

.hero-ring{position:absolute; z-index:0; left:50%; top:54%; translate:-50% -50%; width:min(100vh,70vw); max-width:none; pointer-events:none; will-change:transform}
@keyframes ringspin{to{rotate:360deg}}
@media (prefers-reduced-motion:reduce){.hero-ring{animation:none}}
@media (max-width:760px){.hero-ring{width:80vw; top:48%}}

<body>
<script>document.body.dataset.hc = (new URLSearchParams(location.search).get("colors")) || CONFIG.heroColors || "black-red";</script>

<header class="top" id="top">
  <div class="wrap top-in">
    <a class="logo" href="#" data-home>Emma<b>★</b>N</a>
    <button class="burger" id="burger" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#work">Work</a><a href="#ui">UI</a><a href="#beyond">Beyond UX</a><a href="#about">About</a><a href="playground.html">Playground</a><a class="hire" href="#contact">Contact</a>
    </nav>
  </div>
</header>

<div class="home" id="home"></div>
<div class="cs-view" id="csv"></div>

<dialog class="lb" id="lb" aria-label="Image"><img id="lb-img" alt=""><p id="lb-cap"></p><button class="lb-x" id="lb-x" type="button">Close ✕</button><button class="lb-p" id="lb-p" type="button" aria-label="Previous" hidden>←</button><button class="lb-n" id="lb-n" type="button" aria-label="Next" hidden>→</button></dialog>

<script>
(() => {
  const C = CONFIG;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const u = p => !p ? '' : /^(https?:|data:|\/)/.test(p) ? p : BASE + p;
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const projects = (C.projects || []).filter(p => p.title && (p.summary || (p.caseStudy || []).length));

  /* ── fit text: every .fit fills its parent's width exactly ── */
  function aboutFit() {
    const b = document.querySelector('.abp-big'); if (!b) return;
    const pk = b.parentElement, bot = pk.querySelector('.abp-bot'), sig = pk.querySelector('.abp-sig'), ph = pk.querySelector('.abp-photo');
    const mob = innerWidth < 760, pad = mob ? 16 : 24, gap = mob ? 0 : Math.round(innerWidth * .02);
    b.style.transform = 'none'; b.style.height = '';
    const top = b.offsetTop, natH = b.offsetHeight, natW = b.scrollWidth;
    if (mob) {
      const kx = (pk.clientWidth - pad * 2) / natW, ky = 1.25;
      b.style.transform = `scale(${kx},${ky})`; b.style.height = (natH * ky) + 'px';
      const pw = Math.round((pk.clientWidth - pad * 2) * .62);
      Object.assign(ph.style, { position: 'relative', left: 'auto', right: 'auto', top: 'auto', width: pw + 'px', height: Math.round(pw * 1.2) + 'px', marginTop: '28px' });
      sig.style.top = (top + natH * ky + 28 + pw * 1.2 - 40) + 'px';
      return;
    }
    const avail = pk.clientHeight - bot.offsetHeight - top - 150;
    const ky = Math.max(1.2, Math.min(avail / natH, 3.2));
    const H = natH * ky, pw = Math.round(H * 1.173 * .74);
    const kx = (pk.clientWidth - pad * 2 - pw - gap) / natW;
    b.style.transform = `scale(${kx},${ky})`; b.style.height = H + 'px';
    Object.assign(ph.style, { position: 'absolute', marginTop: '0', right: pad + 'px', left: 'auto', top: (top + H * -.097) + 'px', width: pw + 'px', height: (H * 1.173) + 'px' });
    sig.style.top = (top + H * 1.076 + 4) + 'px';
  }
  function fitAll(root = document) {
    requestAnimationFrame(aboutFit);
    root.querySelectorAll('.fit').forEach(el => {
      const box = el.parentElement.clientWidth; if (!box) return;
      el.style.fontSize = '100px';
      const w = el.scrollWidth || 1;
      el.style.fontSize = (100 * box / w * .995) + 'px';
    });
  }

  /* ── HOME ── */
  function homeHTML() {
    const h = C.hero || {};
    const tick = (C.ticker || []).map(t => `<span>${esc(t)}</span>`).join('');
    const workList = projects.map((p, i) => {
      const has = (p.caseStudy || []).length;
      const tags = (p.meta || '').split('·').map(t => t.trim()).filter(Boolean).slice(0, 4);
      return `<button type="button" class="wk rv${has ? '' : ' soon'}" ${has ? `data-cs="${esc(p.id)}"` : 'aria-disabled="true"'}>
        <div class="wk-t">
          <span class="wk-n">${String(i + 1).padStart(2, '0')} / ${esc(p.year || '')} · ${p.status === 'ongoing' ? 'In progress' : 'Finished'}</span>
          <h3>${esc(p.title)}</h3>
          <p>${esc(p.summary || '')}</p>
          <ul class="wk-tags">${tags.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
          ${has ? '<span class="wk-go">Read the case study <b>→</b></span>' : ''}
        </div>
        ${has ? `<div class="wk-img ht blue">${p.status === 'ongoing' ? '<span class="wk-stamp">In progress</span>' : ''}<img src="${esc(u(p.cover))}" alt="" loading="lazy"></div>`
              : `<div class="wk-img"><span>Case study<br>coming soon</span></div>`}
      </button>`; }).join('');
    const proc = (C.process || []).map((s, i) => `<article class="rv"><div class="pn">0${i + 1}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></article>`).join('');
    const ui = (C.screens || []).map(g => { const imgs = (g.images || []).map(u);
      return `<article class="dv rv">
        <button type="button" class="dv-lap" data-gal="${esc(imgs.join('|'))}" data-cap="${esc(g.title)}" aria-label="View ${esc(g.title)} screens">
          <span class="dv-scr"><img src="${esc(imgs[0])}" alt="${esc(g.title)} homepage" loading="lazy"></span><span class="dv-base"></span>
        </button>
        <div class="dv-t"><h3>${esc(g.title)}</h3><span class="mono">${esc(g.type)}</span>
          <span class="dv-a">${imgs.length > 1 ? `<button type="button" class="mono" data-gal="${esc(imgs.join('|'))}" data-cap="${esc(g.title)}">View ${imgs.length} screens</button>` : ''}${g.link ? `<a class="mono" href="${esc(u(g.link))}" target="_blank" rel="noopener">Visit ↗</a>` : ''}</span></div>
      </article>`; }).join('');
    const b = C.beyond || {};
    const a = C.about || {};
    const xp = (C.experience || []).flatMap(bl => bl.items.map(it => ({ ...it, group: bl.title })));
    const links = (C.links || []).filter(l => l.url);
    return `
    <section class="hero" id="hello">
      <div class="wrap hero-meta mono"><span>Portfolio ’26</span><span>${esc(C.location)}</span></div>
      <div class="wrap hero-name">
        <h1 class="big"><span class="fit" aria-label="${esc(C.name + ' ' + C.surname)}">${esc(C.name)}</span></h1>
        ${h.cutout ? `<figure class="hero-cut" style="--m:url('${esc(u(h.cutout))}')" aria-hidden="true"><img src="${esc(u(h.cutout))}" alt=""></figure>` : ''}
        <img class="hero-ring" src="work/v3/star-ring.png" alt="" aria-hidden="true">
      </div>
      <div class="wrap"><p class="big hero-role"><span class="fit">UX<i>★</i>UI<i>★</i>Designer</span></p></div>
      <div class="wrap hero-row">
        <p>${esc(h.intro)}</p>
        <div class="hero-ctas"><span class="badge mono">${esc(C.availability)}</span><a class="btn" href="#work">${esc(h.cta || 'See the work')} ↓</a></div>
      </div>
    </section>

    <section class="sec" id="work"><div class="wrap">
      <div class="sec-h"><div style="flex:1;min-width:0"><span class="kick">01 — Selected work</span><h2 class="big"><span class="fit">Case studies</span></h2></div></div>
      <div class="work">${workList}</div>
    </div></section>


    <section class="sec" id="ui"><div class="wrap">
      <div class="sec-h"><div style="flex:1;min-width:0"><span class="kick">02 — UI &amp; visual design</span><h2 class="big"><span class="fit">Screens</span></h2></div></div>
      <p class="lead rv" style="margin-bottom:clamp(30px,5vh,56px)">More web and visual design, from client work to self-initiated concepts. Click a laptop to flip through the screens.</p>
      <div class="scs">${ui}</div>
    </div></section>


    <section class="sec bey" id="beyond"><div class="wrap">
      <div class="sec-h"><div style="flex:1;min-width:0"><span class="kick">03 — Beyond UX</span><h2 class="big"><span class="fit">Off the clock</span></h2></div></div>
      <p class="lead rv">${esc(b.intro || '')}</p>
      <p class="mono" style="margin:clamp(28px,5vh,50px) 0 0;color:var(--coral)">Posters · scroll sideways →</p><div class="post-row">${(b.posters || []).map(p => `<button type="button" class="post" data-lb="${esc(u(p))}" data-cap="Poster"><img src="${esc(u(p))}" alt="Poster" loading="lazy"></button>`).join('')}</div>
      ${(b.videos || []).length ? `<p class="mono" style="margin:clamp(40px,7vh,80px) 0 0;color:var(--coral)">${esc(b.videosLabel || 'Video')}</p>
      <div class="reels">${b.videos.map(v => `<figure class="reel"><div class="reel-ph"><video src="${esc(u(v.src))}" poster="${esc(u(v.poster))}" controls playsinline preload="none" aria-label="${esc(v.title)}"></video></div><figcaption>${esc(v.title)}</figcaption></figure>`).join('')}</div>` : ''}
      <div class="bey-cards">${(b.cards || []).map(c => `<article class="rv"><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></article>`).join('')}</div>
      <a class="pg-cta rv" href="playground.html">
        <span class="pg-cta-pics" aria-hidden="true"><img src="work/pg/t/red-jacket-1.jpg" alt=""><img src="work/pg/t/cake-figs-top.jpg" alt=""><img src="work/pg/t/king-of-pop.jpg" alt=""></span>
        <span class="pg-cta-t"><span class="mono">Posters · nails · cakes · photos of me</span><b>Go to the playground →</b><em>drag everything around ✶</em></span>
      </a>
    </div></section>

    <section class="abp" id="about">
      <div class="abp-pk">
        <h2 class="abp-big" aria-label="About me">ABOUT ME</h2>
        <span class="abp-sig" aria-hidden="true">Emma N.</span>
        <img class="abp-photo" src="${esc(u(a.portrait))}" alt="Portrait of Emma Neznikova">
        <div class="abp-bot">
          <div><b>Hi, I’m Emma</b><p>${esc((a.text || [])[0] || '')}</p></div>
          <div><b>Experience</b><ul>${xp.map(it => `<li>${esc(it.what)} · ${esc((it.where || '').split('·')[0].trim())} <span>${esc(it.when || '')}</span></li>`).join('')}</ul></div>
          <div><b>Skills &amp; tools</b><p>${(a.skills || []).map(esc).join(' · ')}</p><p>${(a.tools || []).map(esc).join(' · ')}</p></div>
          <div><b>Languages</b><p>${esc(((a.facts || []).find(f => /lang/i.test(f.label)) || {}).value || '')}</p>
            <b style="margin-top:16px">Next</b><p>${esc(C.availability)}</p>
            ${a.cv ? `<div class="abp-cv"><a href="${esc(u(a.cv))}" target="_blank" rel="noopener">View CV ↗</a><a href="${esc(u(a.cv))}" download>Download ↓</a></div>` : ''}</div>
        </div>
      </div>
    </section>

    <div class="tick me-tick" aria-label="Things about me"><div class="tick-in">${[0,1].map(k => (C.personality || []).map(t => `<span${k ? ' aria-hidden="true"' : ''}>${esc(t)}</span>`).join('')).join('')}</div></div>

    <section class="sec ct" id="contact"><div class="wrap">
      <span class="kick" style="color:var(--ink)">05 — Contact</span>
      <h2 class="big"><span class="fit">Let's work</span><span class="fit w" style="margin-top:.04em">together</span></h2>
      <div class="ct-grid">
        <div class="ct-l">
          <p class="ct-intro">Got a graduation internship, a project or just a question? Write me a little note, I usually answer within a day or two.</p>
          <a class="ct-mail" href="mailto:${esc(C.email)}">${esc(C.email)}</a>
          <div class="ct-row">
            <span class="badge mono">${esc(C.availability)} · ${esc(C.location)}</span>
            <div class="ct-links">
              <button type="button" class="btn" id="copy">Copy email</button>
              ${links.map(l => `<a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}
            </div>
          </div>
        </div>
        <form class="mform mf1" novalidate aria-label="Write Emma a message">
          <p class="mf1-k"><span class="mf1-ic" aria-hidden="true">✉</span> Write me an email right here: fill in the gaps and hit send</p>
          <p class="mf1-line">Hi Emma, I’m <input name="name" autocomplete="name" placeholder="your name" size="9"> from <input name="org" autocomplete="organization" placeholder="company" size="8"> and I’d love to talk about <input name="topic" placeholder="an internship" size="12">.</p>
          <label class="mf1-msg"><span>Anything else? (optional)</span><textarea name="msg" rows="2" placeholder="Write it here…"></textarea></label>
          <div class="mf1-end"><button type="submit" class="mf-go"><span>Send it</span><b>★</b></button>
          <p class="mf1-note">This opens your email app (Gmail, Mail, Outlook…) with the message ready to send to <u>${esc(C.email)}</u>. Just press send there.</p></div>
        </form>
      </div>
      <div class="foot"><span>© ${new Date().getFullYear()} Emma Neznikova</span><span>Designed by me · built with AI</span><a href="#hello">Back to top ↑</a></div>
    </div></section>`;
  }

  /* ── CASE STUDY BLOCKS ── */
  const P = t => esc(t);
  const lab = l => l ? `<p class="lab">${esc(l)}</p>` : '';
  const img = (src, alt = '', cls = '') => src ? `<img src="${esc(u(src))}" alt="${esc(alt)}" loading="lazy" class="${cls}" data-lb="${esc(u(src))}" data-cap="${esc(alt)}">` : '';
  const B = {
    hero: (b, p) => `<header class="cs-hero"><span class="mono">${esc(p.meta || '')}</span><h1>${esc(b.title || p.title)}</h1>
        ${b.image ? `<figure class="${b.paper ? 'paper' : /\.png$/.test(b.image) ? 'mock' : ''}">${img(b.image, b.alt)}${b.caption ? `<figcaption class="mono" style="margin-top:8px">${esc(b.caption)}</figcaption>` : ''}</figure>` : ''}</header>`,
    glance: b => `<div class="gl"><span class="gl-t">${esc(b.title || 'At a glance')}</span>${(b.items || []).map(i => `<div><b>${esc(i.label)}</b><p>${esc(i.text)}</p></div>`).join('')}</div>`,
    facts: b => `<dl class="facts">${(b.items || []).map(f => `<div><dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd></div>`).join('')}</dl>`,
    text: b => `<div class="t2${b.big ? ' big' : ''}">${lab(b.label)}<p>${P(b.text)}</p></div>`,
    split: b => !(b.image || b.video) ? '' : `<div class="split${b.flip ? ' flip' : ''}"><div class="sp-t">${lab(b.label)}<p>${P(b.text)}</p></div>
        <figure class="sp-f">${b.video ? `<video class="sp-v" src="${esc(u(b.video))}" poster="${esc(u(b.poster || ''))}" controls playsinline preload="metadata" aria-label="${esc(b.alt || '')}"></video>` : img(b.image, b.alt)}${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure></div>`,
    sprints: b => `${lab(b.label)}<ol class="sprints">${(b.items || []).map(s => `<li><span class="no">${esc(s.no)}</span><b>${esc(s.goal)}</b><p>${esc(s.note)}</p>${s.retro ? `<span class="re">${esc(s.retro)}</span>` : ''}</li>`).join('')}</ol>`,
    stakeholders: b => `${lab(b.label)}<div class="sh">${(b.quadrants || []).map(q => `<div class="${q.key ? 'key' : ''}"><h4>${esc(q.title)}</h4><small>${esc(q.note)}</small><ul>${(q.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div>`,
    stats: b => `<div class="stats">${(b.items || []).map(s => `<div><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('')}</div>${b.after ? `<p class="stats-after">${esc(b.after)}</p>` : ''}`,
    quote: b => `<blockquote class="quote"><p>${esc(b.text)}</p>${b.by ? `<cite>— ${esc(b.by)}</cite>` : ''}</blockquote>`,
    empathy: b => `${lab(b.title)}${b.persona ? `<p class="emp-p">${esc(b.persona)}</p>` : ''}<div class="emp">${(b.quadrants || []).map(q => `<div><h4>${esc(q.label)}</h4><ul>${(q.notes || []).map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>`).join('')}</div>`,
    list: b => `${lab(b.label)}<ol class="list">${(b.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ol>`,
    statement: b => `<div class="stm">${lab(b.label)}<h3>${esc((b.lines || [])[0] || '')}</h3>${(b.lines || []).slice(1).map(l => `<p>${esc(l)}</p>`).join('')}</div>`,
    versions: b => `${lab(b.label)}${b.intro ? `<p style="margin:0 0 24px;font-size:18px">${esc(b.intro)}</p>` : ''}<div class="vers">${(b.items || []).map(v => `<figure class="${v.winner ? 'win' : ''}">${img(v.image, v.alt)}${v.stamp ? `<span class="stp">${esc(v.stamp)}</span>` : ''}</figure>`).join('')}</div>`,
    gallery: b => `${lab(b.label)}${b.note ? `<p style="margin:0 0 22px;max-width:720px;font-size:18px">${esc(b.note)}</p>` : ''}<div class="gal">${(b.items || []).map(it => `<figure>${img(it.image, it.caption)}${it.caption ? `<figcaption>${esc(it.caption)}</figcaption>` : ''}</figure>`).join('')}</div>`,
    pages: b => `${lab(b.label)}<div class="pgs">${(b.items || []).map(it => `<figure><figcaption>${esc(it.title)}</figcaption><div class="pgs-in" tabindex="0" aria-label="${esc(it.title)} page, scrollable"><img src="${esc(u(it.image))}" alt="${esc(it.title)} page" loading="lazy"></div></figure>`).join('')}</div>${b.note ? `<p class="scrollnote">${esc(b.note)}</p>` : ''}`,
    scroll: b => `${lab(b.label)}<div class="scrollf" tabindex="0" aria-label="${esc(b.alt || 'Scrollable design')}"><img src="${esc(u(b.image))}" alt="${esc(b.alt || '')}" loading="lazy"></div>${b.note ? `<p class="scrollnote">${esc(b.note)}</p>` : ''}`,
    link: b => `<div class="t2">${lab(b.label)}<div><p style="margin-bottom:18px">${esc(b.text || '')}</p><a class="btn red" href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.button || 'Open ↗')}</a></div></div>`,
    image: b => `<figure class="fig${b.wide ? '' : ' narrow'}">${img(b.image, b.alt)}${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure>`,
    directions: b => `${lab(b.label)}${b.note ? `<p style="margin:0 0 30px;max-width:720px;font-size:18px">${esc(b.note)}</p>` : ''}<div class="dirs">${(b.items || []).map((d, i) => `<div class="dir"><h4><span>0${i + 1}</span>${esc(d.title)}</h4><p>${esc(d.text)}</p>${img(d.image, d.title + ' storyboard')}</div>`).join('')}</div>`,
    built: b => `<div class="built">${lab(b.label)}<p>${esc(b.text)}</p><div class="collage">${(b.images || []).map(i => img(i.image, i.alt)).join('')}</div></div>`,
  };

  function caseHTML(p) {
    const blocks = p.caseStudy || [];
    const steps = [...new Set(blocks.map(b => b.step).filter(Boolean))];
    let last = null;
    const body = blocks.length ? blocks.map(b => {
      let a = '';
      if (b.step && b.step !== last) { last = b.step; a = `<span class="cs-anchor" data-step="${esc(b.step)}"></span>`; }
      const html = (B[b.type] || (() => ''))(b, p);
      return html ? a + (b.type === 'hero' ? html : `<section class="blk rv">${html}</section>`) : a;
    }).join('') : `${B.hero({ title: p.title }, p)}<div class="cs-soon"><b>In progress</b><p>${esc(p.summary || '')}</p></div>`;
    const i = projects.indexOf(p), next = projects[(i + 1) % projects.length];
    return `<div class="cs-bar"><div class="wrap cs-bar-in"><button type="button" class="cs-back" data-home>← All work</button>
        ${steps.length > 1 ? `<nav class="cs-steps" aria-label="Case study phases">${steps.map((s, k) => `<button type="button" data-step="${esc(s)}">${String(k + 1).padStart(2, '0')} ${esc(s)}</button>`).join('')}</nav>` : ''}</div></div>
      <article class="wrap cs">${body}</article>
      ${next && next !== p ? `<button type="button" class="cs-next" data-cs="${esc(next.id)}"><div class="wrap"><span class="mono">Next project →</span><b>${esc(next.title)}</b></div></button>` : ''}`;
  }

  /* ── routing ── */
  const home = $('home'), csv = $('csv');
  home.innerHTML = homeHTML();
  let curCs = null;
  function route() {
    const m = location.hash.match(/^#work\/([\w-]+)/);
    const p = m && projects.find(x => x.id === m[1]);
    if (p) {
      if (curCs !== p.id) { csv.innerHTML = caseHTML(p); curCs = p.id; reveal(csv); wireSteps(); }
      document.body.classList.add('in-cs'); window.scrollTo(0, 0); fitAll(csv);
      document.title = `${p.title} — Emma Neznikova`;
    } else {
      const was = document.body.classList.contains('in-cs');
      document.body.classList.remove('in-cs'); curCs = null; csv.innerHTML = '';
      document.title = 'Emma Neznikova — UX/UI Designer';
      fitAll(home);
      const id = location.hash.slice(1);
      const t = id && document.getElementById(id);
      if (t) requestAnimationFrame(() => t.scrollIntoView({ behavior: was || RM ? 'auto' : 'smooth' }));
      else if (was) { const w = $('work'); w && w.scrollIntoView(); }
    }
  }
  addEventListener('hashchange', route);
  document.addEventListener('click', e => {
    const cs = e.target.closest('[data-cs]');
    if (cs) { e.preventDefault(); location.hash = 'work/' + cs.dataset.cs; return; }
    const h = e.target.closest('[data-home]');
    if (h) { e.preventDefault(); if (document.body.classList.contains('in-cs')) { history.pushState(null, '', '#work'); route(); } else { history.pushState(null, '', location.pathname); scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }); } return; }
    const gEl = e.target.closest('[data-gal]');
    if (gEl) { e.preventDefault(); const list = gEl.dataset.gal.split('|'); openLb(list[0], gEl.dataset.cap || '', list); return; }
    const l = e.target.closest('[data-lb]');
    if (l) { e.preventDefault(); openLb(l.dataset.lb, l.dataset.cap || ''); return; }
    const a = e.target.closest('a[href^="#"]');
    if (a) { $('nav').classList.remove('open'); $('burger').setAttribute('aria-expanded', 'false'); }
  });

  /* case-study phase bar */
  let stepObs;
  function wireSteps() {
    stepObs?.disconnect();
    const btns = [...csv.querySelectorAll('.cs-steps button')];
    if (!btns.length) return;
    const anchors = [...csv.querySelectorAll('.cs-anchor')];
    btns.forEach(b => b.addEventListener('click', () => {
      const a = anchors.find(x => x.dataset.step === b.dataset.step);
      if (a) scrollTo({ top: a.getBoundingClientRect().top + scrollY - 130, behavior: RM ? 'auto' : 'smooth' });
    }));
    const set = () => {
      let cur = anchors[0]?.dataset.step;
      anchors.forEach(a => { if (a.getBoundingClientRect().top < innerHeight * .4) cur = a.dataset.step; });
      btns.forEach(b => { const on = b.dataset.step === cur; b.classList.toggle('on', on); if (on) b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); });
    };
    stepObs = { disconnect: () => removeEventListener('scroll', set) };
    addEventListener('scroll', set, { passive: true }); set();
  }

  /* reveal on scroll */
  let io;
  function reveal(root) {
    const els = root.querySelectorAll('.rv');
    if (RM || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
    io = io || new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -6% 0px', threshold: .06 });
    els.forEach(e => io.observe(e));
  }
  reveal(home);

  /* header + menu */
  const top = $('top');
  const onScroll = () => top.classList.toggle('solid', scrollY > 20 || document.body.classList.contains('in-cs'));
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
  $('burger').addEventListener('click', () => { const o = $('nav').classList.toggle('open'); $('burger').setAttribute('aria-expanded', String(o)); $('burger').textContent = o ? 'Close' : 'Menu'; });

  /* lightbox */
  const lb = $('lb');
  let gal = [], gi = 0;
  function showG() { $('lb-img').src = gal[gi]; $('lb-cap').textContent = gal.cap + (gal.length > 1 ? ` · ${gi + 1} / ${gal.length}` : ''); }
  function openLb(src, cap, list) { gal = list || [src]; gal.cap = cap; gi = 0; $('lb-img').alt = cap; $('lb-p').hidden = $('lb-n').hidden = gal.length < 2; showG(); if (!lb.open) lb.showModal(); }
  $('lb-p').addEventListener('click', () => { gi = (gi - 1 + gal.length) % gal.length; showG(); });
  $('lb-n').addEventListener('click', () => { gi = (gi + 1) % gal.length; showG(); });
  lb.addEventListener('keydown', e => { if (e.key === 'ArrowRight') $('lb-n').click(); if (e.key === 'ArrowLeft') $('lb-p').click(); });
  $('lb-x').addEventListener('click', () => lb.close());
  lb.addEventListener('click', e => { if (e.target === lb) lb.close(); });

  /* copy email */
  $('copy')?.addEventListener('click', async e => {
    try { await navigator.clipboard.writeText(C.email); } catch (_) {}
    e.target.textContent = 'Copied ★'; setTimeout(() => e.target.textContent = 'Copy email', 1600);
  });

  /* fit text once fonts are in, and on resize */
  let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => fitAll(), 120); });
  (document.fonts?.ready || Promise.resolve()).then(() => fitAll());
  route();
  setTimeout(() => fitAll(), 400);
})();
</script>
<script>
document.addEventListener('submit', e => {
  const f = e.target.closest && e.target.closest('form.slip, form.mform'); if (!f) return;
  e.preventDefault();
  const d = new FormData(f), to = (typeof CONFIG !== 'undefined' && CONFIG.email) || 'eneznik@gmail.com';
  const name = (d.get('name') || '').trim(), org = (d.get('org') || '').trim();
  const subject = `${(d.get('topic') || '').trim() || 'Hello'} · via your portfolio`;
  const topic = (d.get('topic') || '').trim();
  const body = f.classList.contains('mf1')
    ? `Hi Emma,\n\nI'm ${name || '…'}${org ? ' from ' + org : ''} and I'd love to talk about ${topic || 'working together'}.\n\n${(d.get('msg') || '').trim()}\n\n${name}`
    : `${(d.get('msg') || '').trim()}\n\n${name ? '— ' + name : ''}${org ? ', ' + org : ''}`;
  location.href = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  f.classList.add('sent'); const n = f.querySelector('.slip-note, .mf1-note'); if (n) n.textContent = 'Your email app should open now with the message ready. Press send there. Thank you! ✶';
});
</script>
<script>
(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let ticking = false;
  const spin = () => { const r = document.querySelector('.hero-ring'); if (r) r.style.rotate = (scrollY * 0.18) + 'deg'; ticking = false; };
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(spin); } }, { passive: true });
})();
</script>
</body>
</html>
